   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  background:var(--ink-100);
  color:var(--ink-900);
  font-family:'Instrument Sans Var',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
::selection{background:var(--ink-900);color:var(--ink-100)}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
input:focus,select:focus,textarea:focus{outline:none}
/* Oculto para la vista, presente para lectores de pantalla. El clip-path
   evita que el elemento arrastre el ancho de la página, y el contenedor
   de tablas se declara posicionado para que estas etiquetas no se escapen
   del área con desplazamiento propio. */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}

/* ============================================================
   3. FIRMA VISUAL — "la etiqueta"
   Todo el sistema tipográfico secundario imita las etiquetas
   cosidas de una prenda: mayúsculas diminutas, muy espaciadas.
   Y las divisiones estructurales no son líneas: son pespuntes.
   ============================================================ */
.etiqueta{
  font-size:.6875rem;line-height:1;letter-spacing:.22em;
  text-transform:uppercase;font-weight:600;
}
.etiqueta-sm{
  font-size:.625rem;line-height:1;letter-spacing:.24em;
  text-transform:uppercase;font-weight:600;
}
.display{
  font-family:'Archivo Var',system-ui,sans-serif;
  font-variation-settings:'wdth' 108,'wght' 700;
  text-transform:uppercase;line-height:.86;letter-spacing:-.045em;
}
.display-ancho{
  font-family:'Archivo Var',system-ui,sans-serif;
  font-variation-settings:'wdth' 118,'wght' 800;
  text-transform:uppercase;line-height:.84;letter-spacing:-.045em;
}
.cifra{font-variant-numeric:tabular-nums}

.costura{
  height:1px;color:var(--ink-300);
  background-image:repeating-linear-gradient(to right,currentColor 0 9px,transparent 9px 16px);
}
.costura.oscura{color:var(--ink-600)}

.tela{
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 7px);
}

/* ============================================================
   4. ESTRUCTURA
   ============================================================ */
.shell{width:100%;max-width:var(--shell);margin-inline:auto;padding-inline:var(--canal)}
.seccion{padding-block:5rem}
.seccion-oscura{background:var(--ink-900);color:var(--ink-100)}
.seccion-papel{background:var(--papel)}
@media(min-width:768px){.seccion{padding-block:7rem}}

.enc{display:flex;flex-direction:column;gap:1.5rem}
.enc-titulo{font-size:clamp(2rem,5vw,3.5rem)}
.enc-eyebrow{color:var(--ink-500);margin-bottom:1rem}
.enc-desc{margin-top:1.25rem;max-width:36rem;font-size:.875rem;line-height:1.7;color:var(--ink-500)}
.seccion-oscura .enc-eyebrow{color:var(--ink-400)}
.seccion-oscura .enc-desc{color:var(--ink-300)}
@media(min-width:768px){
  .enc{flex-direction:row;align-items:flex-end;justify-content:space-between}
  .enc-texto{max-width:42rem}
}

.link-sub{position:relative;display:inline-block}
.link-sub::after{
  content:'';position:absolute;left:0;bottom:-.25rem;width:100%;height:1px;
  background:currentColor;transform:scaleX(0);transform-origin:right;
  transition:transform .3s var(--seam);
}
.link-sub:hover::after,.link-sub:focus-visible::after{transform:scaleX(1);transform-origin:left}

.enlace-flecha{display:inline-flex;align-items:center;gap:.75rem;flex-shrink:0}
.enlace-flecha svg{transition:transform .3s var(--seam)}
.enlace-flecha:hover svg{transform:translateX(4px)}

/* ============================================================
   5. BOTONES
   ============================================================ */
.boton{
  display:inline-flex;align-items:center;justify-content:center;gap:.625rem;
  height:2.75rem;padding-inline:1.5rem;border:1px solid transparent;
  font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  transition:background-color .3s var(--seam),color .3s var(--seam),border-color .3s var(--seam);
}
.boton:disabled{opacity:.4;pointer-events:none}
.boton.grande{height:3.5rem;padding-inline:2.25rem}
.boton.chico{height:2.25rem;padding-inline:1rem;font-size:.625rem;letter-spacing:.2em}
.boton.bloque{width:100%}
.boton.solido{background:var(--ink-900);color:var(--ink-100);border-color:var(--ink-900)}
.boton.solido:hover{background:var(--ink-700);border-color:var(--ink-700)}
.boton.contorno{border-color:var(--ink-900);color:var(--ink-900)}
.boton.contorno:hover{background:var(--ink-900);color:var(--ink-100)}
.boton.claro{background:var(--ink-100);color:var(--ink-900);border-color:var(--ink-100)}
.boton.claro:hover{background:var(--papel)}
.boton.contorno-claro{border-color:var(--ink-300);color:var(--ink-100)}
.boton.contorno-claro:hover{background:var(--ink-100);color:var(--ink-900);border-color:var(--ink-100)}

/* ============================================================
   6. INSIGNIAS Y ESTADOS
   ============================================================ */
.insignia{
  display:inline-flex;align-items:center;height:1.5rem;padding-inline:.625rem;
  font-size:.625rem;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
}
.insignia.oscura{background:var(--ink-900);color:var(--ink-100)}
.insignia.clara{background:var(--ink-100);color:var(--ink-900)}
.estado{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink-500)}
.estado .punto{width:.375rem;height:.375rem;background:currentColor;flex-shrink:0}
.estado.avisa{color:var(--ink-900)}
.claro .estado{color:var(--ink-400)}

/* ============================================================
   7. CAMPOS
   ============================================================ */
.campo{
  width:100%;border:1px solid var(--ink-200);background:var(--papel);
  padding:.875rem 1rem;font-size:.875rem;color:var(--ink-900);
  transition:border-color .2s;
}
.campo::placeholder{color:var(--ink-400)}
.campo:focus{border-color:var(--ink-900)}
select.campo{height:3.25rem;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-500) 50%),linear-gradient(135deg,var(--ink-500) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:2.5rem}
textarea.campo{resize:vertical;min-height:8rem}
.campo-oscuro{
  width:100%;border:1px solid var(--ink-600);background:transparent;
  padding:.875rem 1rem;font-size:.875rem;color:var(--ink-100);transition:border-color .2s;
}
.campo-oscuro::placeholder{color:var(--ink-500)}
.campo-oscuro:focus{border-color:var(--ink-100)}
.etiqueta-campo{display:block;margin-bottom:.75rem;color:var(--ink-500)}
.ayuda-campo{margin-top:.5rem;font-size:.75rem;color:var(--ink-400)}
.error-campo{margin-top:.5rem;color:var(--ink-900)}
.campo.invalido{border-color:var(--ink-900)}

/* ============================================================
   8. MEDIA — dibujo técnico plano generado
   ============================================================ */
.media{position:relative;overflow:hidden;background:var(--ink-900)}
.media.retrato{aspect-ratio:4/5}
.media.cuadrado{aspect-ratio:1/1}
.media.panoramico{aspect-ratio:16/10}
.media.lleno{position:absolute;inset:0;aspect-ratio:auto}
.media > .fondo,.media > .brillo,.media > .tela{position:absolute;inset:0}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.media svg.trazo{position:absolute;inset:0;width:100%;height:100%;padding:8%}
.media .codigo{position:absolute;left:.75rem;bottom:.75rem;opacity:.7}

/* ============================================================
   9. AVISO + HEADER
   ============================================================ */
.aviso{background:var(--ink-900);color:var(--ink-100)}
.aviso .shell{display:flex;align-items:center;justify-content:space-between;height:2.25rem;gap:1rem}

}

/* Menú móvil */
.drawer{position:fixed;inset:0;z-index:70}
.drawer .velo{position:absolute;inset:0;background:rgba(10,10,10,.6);animation:aparecer .3s ease-out both}
.drawer .panel{
  border:0;
  position:absolute;top:0;right:0;bottom:0;width:100%;max-width:24rem;

   10. HERO
   ============================================================ */

<script>
/* ══════════════════════════════════════════════════════════════
   ÓNIX — Tienda y panel administrativo en un solo archivo.

   ORDEN DEL ARCHIVO
     1. Utilidades              2. Datos semilla
     3. Origen de datos (DB)    4. Sesión
     5. Carrito y favoritos     6. Iconos y media
     7. Piezas de interfaz      8. Tienda pública
     9. Panel administrativo   10. Enrutador y eventos

   La regla que sostiene todo: hay UN solo origen de datos (DB) y
   dos interfaces encima. El panel escribe, DB avisa, la tienda se
   repinta. No hay copias del catálogo en ningún otro sitio.
   ══════════════════════════════════════════════════════════════ */
(function () {
'use strict';

/* ── 1. UTILIDADES ────────────────────────────────────────── */

/** Escapa HTML. Todo dato del administrador pasa por aquí antes de pintarse. */
function esc(valor) {
  return String(valor == null ? '' : valor).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/** Formato de precio determinista, sin Intl. */
function precio(valor, conCentavos) {
  const negativo = valor < 0;
  const absoluto = Math.abs(Number(valor) || 0);
  const entero = Math.floor(absoluto);
  const centavos = Math.round((absoluto - entero) * 100);
  const grupos = String(entero).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (negativo ? '-' : '') + '$' + grupos + (conCentavos ? '.' + String(centavos).padStart(2, '0') : '');
}

function descuento(actual, anterior) {
  if (!anterior || anterior <= actual) return 0;
  return Math.round(((anterior - actual) / anterior) * 100);
}

function sinAcentos(s) {
  return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

function slugify(texto) {
  return sinAcentos(texto).trim().replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
}

function limpiar(s, max) {
  return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, max || 4000);
}

function esCorreo(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v).trim()); }

/** «1 pieza» / «3 piezas». Escribir el plural a mano siempre acaba mal. */
function plural(n, singular, plural_) {
  return n + ' ' + (Math.abs(n) === 1 ? singular : (plural_ || singular + 's'));
}

function uid(prefijo) {
  return (prefijo || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function copia(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }

function acotar(v, min, max) { return Math.min(Math.max(Number(v) || 0, min), max); }

/** Entero estable a partir de un texto: varía el arte generado y el stock semilla. */
function semilla(texto) {
  let h = 0;
  const s = String(texto);
  for (let i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; }
  return Math.abs(h);

const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

function fechaCorta(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  return d.getDate() + ' ' + MESES[d.getMonth()] + ' ' + d.getFullYear();
}

function fechaLarga(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  return fechaCorta(iso) + ' · ' + hh + ':' + mm;
}

function hoyISO() { return new Date().toISOString(); }

function diasAtras(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d.toISOString();

const CHUMBO = { nombre: 'Chumbo', hex: '#2c2c2c' };
const CINZA = { nombre: 'Gris piedra', hex: '#75706f' };

const HUESO = { nombre: 'Hueso', hex: '#eaeaea' };

/**
 * La variante (color + talla) es la unidad real de inventario: lo que se
 * vende, lo que se agota y lo que se repone. El "stock" de un producto es
 * siempre la suma de sus variantes, nunca un número aparte.
 */
function variantes(sku, colores, tallas, base) {
  const salida = [];
  colores.forEach(function (color, ci) {
    tallas.forEach(function (talla, ti) {
      const s = semilla(sku + color.nombre + talla);
      let stock = base === 0 ? 0 : Math.max(0, (s % (base + 6)) - 2);
      if (base > 0 && stock === 0 && (s % 5) !== 0) stock = 1 + (s % 4);
      salida.push({
        color: color.nombre,
        talla: talla,
        stock: stock,
        sku: sku + '-' + sinAcentos(color.nombre).slice(0, 3).toUpperCase() + '-' + String(talla).toUpperCase()
      });
    });
  });
  return salida;
}

/**
 * Luminancia del color → tono del dibujo técnico. Cualquier color que se
 * dé de alta, hoy o dentro de un año, cae solo en el tono que le toca:
 * oscuro sobre noche, medio sobre humo, claro sobre papel.
 */
function luzDeHex(hex) {
  const h = String(hex || '#121212').replace('#', '');
  const largo = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
  const r = parseInt(largo.slice(0, 2), 16) || 0;
  const g = parseInt(largo.slice(2, 4), 16) || 0;
  const b = parseInt(largo.slice(4, 6), 16) || 0;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
}

function tonoDeHex(hex) {
  const luz = luzDeHex(hex);
  if (luz < 0.34) return 'noche';
  if (luz < 0.74) return 'humo';
  return 'papel';
}

/** Juego de imágenes por defecto para un color: vista completa y detalle. */
function imagenesDeColor(hex, arte) {
  const tono = tonoDeHex(hex);
  return [
    { origen: 'generado', arte: arte, tono: tono, hex: hex },
    { origen: 'generado', arte: arte, tono: tono, hex: hex, detalle: true }
  ];
}

function prod(p) {
  p.variantes = variantes(p.sku, p.colores, p.tallas, p.base == null ? 8 : p.base);
  delete p.base;
  /* Cada color lleva sus propias fotos. Elegir un color en la ficha
     cambia la galería entera, no solo el recuadro del selector. */
  const arte = (p.imagenes[0] && p.imagenes[0].arte) || 'accesorio';
  p.colores = p.colores.map(function (c) {
    return { nombre: c.nombre, hex: c.hex, imagenes: c.imagenes || imagenesDeColor(c.hex, arte) };
  });
  p.estado = p.estado || 'activo';
  p.creadoEn = p.creadoEn || hoyISO();
  p.actualizadoEn = p.creadoEn;
  return p;
}

function pedidoSemilla(numero, cliente, items, estado, dias, cupon) {
  const subtotal = items.reduce(function (t, i) { return t + i.precio * i.cantidad; }, 0);
  const dcto = cupon === 'ONIX10' ? Math.round(subtotal * 0.1) : 0;
  const envio = subtotal - dcto >= 1200 ? 0 : 149;
  return {
    id: uid('ped_'), numero: numero,
    clienteId: cliente.id,
    cliente: { nombre: cliente.nombre, correo: cliente.correo, telefono: cliente.telefono, direccion: cliente.direccion },
    items: items, cupon: cupon || '',
    subtotal: subtotal, descuento: dcto, envio: envio, total: subtotal - dcto + envio,
    estado: estado, notas: '', creadoEn: diasAtras(dias), actualizadoEn: diasAtras(dias)
  };
}

/* ── 3. ORIGEN DE DATOS ───────────────────────────────────────
   Un solo objeto guarda todo el estado del negocio. El panel
   escribe aquí, DB avisa y cada vista suscrita se repinta. Nadie
   más conserva una copia del catálogo.

   Hoy persiste en localStorage. Mañana, cada método de escritura
   pasa a ser una consulta a Supabase: el contrato no cambia.
   ────────────────────────────────────────────────────────────── */
const DB = (function () {
  const CLAVE = 'onix.datos.v1';
  const oyentes = {};
  let datos = null;

  function fresco() {
    return {
      version: 1,
      categorias: copia(CATEGORIAS_SEMILLA),
      productos: copia(PRODUCTOS_SEMILLA),
      clientes: copia(CLIENTES_SEMILLA),
      pedidos: copia(PEDIDOS_SEMILLA),
      cupones: copia(CUPONES_SEMILLA),
      contenido: copia(CONTENIDO_SEMILLA)
    };
  }

  /**
   * Lo guardado en el navegador puede venir de una versión anterior del
   * archivo. En vez de descartarlo —que borraría el catálogo del cliente—
   * se completa lo que falte. Cada campo nuevo se añade aquí.
   */
  function migrar(v) {
    v.categorias = Array.isArray(v.categorias) ? v.categorias : [];
    v.clientes = Array.isArray(v.clientes) ? v.clientes : [];
    v.pedidos = Array.isArray(v.pedidos) ? v.pedidos : [];
    v.cupones = Array.isArray(v.cupones) ? v.cupones : [];

    v.productos = (Array.isArray(v.productos) ? v.productos : []).map(function (p) {
      const arte = (p.imagenes && p.imagenes[0] && p.imagenes[0].arte) || 'accesorio';
      /* v2: cada color lleva sus propias imágenes. */
      p.colores = (p.colores || []).map(function (c) {
        const hex = c.hex || '#121212';
        return {
          nombre: c.nombre || 'Sin nombre', hex: hex,
          imagenes: (c.imagenes && c.imagenes.length) ? c.imagenes : imagenesDeColor(hex, arte)
        };
      });
      p.imagenes = p.imagenes || [];
      p.variantes = p.variantes || [];
      p.tallas = p.tallas || [];
      p.cuidados = p.cuidados || [];
      p.estado = p.estado || 'activo';
      return p;
    });

    const semilla = copia(CONTENIDO_SEMILLA);
    v.contenido = Object.assign(semilla, v.contenido || {});
    v.contenido.config = Object.assign(semilla.config, (v.contenido && v.contenido.config) || {});
    v.version = 2;
    return v;
  }

  function leer() {
    try {
      const crudo = window.localStorage.getItem(CLAVE);
      if (!crudo) return null;
      const v = JSON.parse(crudo);
      if (!v || !Array.isArray(v.productos) || !Array.isArray(v.categorias)) return null;
      return migrar(v);
    } catch (e) { return null; }
  }

  function escribir() {
    try { window.localStorage.setItem(CLAVE, JSON.stringify(datos)); }
    catch (e) { /* modo privado o cuota llena: la sesión sigue en memoria */ }
  }

  function avisar(canal) {
    (oyentes[canal] || []).forEach(function (fn) { fn(); });
    (oyentes['*'] || []).forEach(function (fn) { fn(); });
  }

  function guardar(canal) { escribir(); avisar(canal); }

  /* Espejo en la nube. Si `env.js` no existe no hace nada, así que
     el mismo código sirve para la demostración y para producción. */
  function espejo(tabla, fila, borrar) {
    if (!Nube.activa()) return;
    const promesa = borrar ? Nube.borrar(tabla, fila.id) : Nube.guardar(tabla, fila);
    promesa.catch(function (e) { aviso('No se guardó en Supabase: ' + e.message, true); });
  }

  datos = leer() || fresco();

  /* Dos pestañas abiertas comparten el mismo almacén: la que no
     escribió se entera por este evento y se repinta. */
  window.addEventListener('storage', function (ev) {
    if (ev.key !== CLAVE) return;
    const nuevo = leer();
    if (nuevo) { datos = nuevo; avisar('*'); }
  });

  function porId(lista, id) {
    return lista.find(function (x) { return x.id === id; }) || null;
  }

  return {
    on: function (canal, fn) { (oyentes[canal] = oyentes[canal] || []).push(fn); },
    crudo: function () { return datos; },

    /* ── Lectura ── */
    categorias: function (soloActivas) {
      const l = datos.categorias.slice().sort(function (a, b) { return a.orden - b.orden; });
      return soloActivas ? l.filter(function (c) { return c.activa; }) : l;
    },
    categoria: function (slug) {
      return datos.categorias.find(function (c) { return c.slug === slug; }) || null;
    },

    /**
     * @param {object} op { todos:true para incluir borradores y archivados }
     * La tienda nunca pide `todos`; el panel siempre.
     */
    productos: function (op) {
      op = op || {};
      let l = datos.productos.slice();
      if (!op.todos) {
        const activas = datos.categorias.filter(function (c) { return c.activa; })
          .map(function (c) { return c.slug; });
        l = l.filter(function (p) { return p.estado === 'activo' && activas.indexOf(p.categoria) !== -1; });
      }
      return l;
    },
    producto: function (clave) {
      return datos.productos.find(function (p) { return p.slug === clave || p.id === clave; }) || null;
    },

    pedidos: function () {
      return datos.pedidos.slice().sort(function (a, b) { return b.creadoEn.localeCompare(a.creadoEn); });
    },
    pedido: function (numero) {
      return datos.pedidos.find(function (p) { return p.numero === numero; }) || null;
    },
    clientes: function () { return datos.clientes.slice(); },
    cupones: function () { return datos.cupones.slice(); },
    contenido: function () { return datos.contenido; },
    config: function () { return datos.contenido.config; },

    /** Dos productos con el mismo slug dejan uno inaccesible en la tienda. */
    slugLibre: function (slug, idPropio) {
      return !datos.productos.some(function (p) { return p.slug === slug && p.id !== idPropio; });
    },
    skuLibre: function (sku, idPropio) {
      return !datos.productos.some(function (p) { return p.sku === sku && p.id !== idPropio; });
    },
    /** Devuelve el slug pedido o el primero libre: `camisa`, `camisa-2`… */
    slugDisponible: function (base, idPropio) {
      let candidato = base, n = 2;
      while (!this.slugLibre(candidato, idPropio)) { candidato = base + '-' + n; n++; }
      return candidato;
    },

    /* ── Escritura: catálogo ── */
    guardarProducto: function (entrada) {
      const existente = entrada.id ? porId(datos.productos, entrada.id) : null;
      if (existente) {
        Object.assign(existente, entrada, { actualizadoEn: hoyISO() });
      } else {
        datos.productos.unshift(Object.assign({
          id: uid('prod_'), creadoEn: hoyISO(), actualizadoEn: hoyISO(),
          valoracion: 0, resenas: 0, variantes: []
        }, entrada));
      }
      const guardadoFinal = existente || datos.productos[0];
      guardar('productos');
      espejo('productos', guardadoFinal);
      return guardadoFinal;
    },
    eliminarProducto: function (id) {
      datos.productos = datos.productos.filter(function (p) { return p.id !== id; });
      guardar('productos');
      espejo('productos', { id: id }, true);
    },
    duplicarProducto: function (id) {
      const p = porId(datos.productos, id);
      if (!p) return null;
      const nuevo = copia(p);
      nuevo.id = uid('prod_');
      nuevo.nombre = p.nombre + ' (copia)';
      nuevo.slug = p.slug + '-copia-' + Math.random().toString(36).slice(2, 5);
      nuevo.sku = p.sku + '-C';
      nuevo.estado = 'borrador';
      nuevo.destacado = false;
      nuevo.creadoEn = hoyISO();
      nuevo.actualizadoEn = hoyISO();
      datos.productos.unshift(nuevo);
      guardar('productos');
      espejo('productos', nuevo);
      return nuevo;
    },
    actualizarVariantes: function (id, variantes) {
      const p = porId(datos.productos, id);
      if (!p) return;
      p.variantes = variantes;
      p.actualizadoEn = hoyISO();
      guardar('productos');
      espejo('productos', p);
    },

    guardarCategoria: function (entrada) {
      const existente = entrada.id ? porId(datos.categorias, entrada.id) : null;
      if (existente) Object.assign(existente, entrada);
      else datos.categorias.push(Object.assign({
        id: uid('cat_'), orden: datos.categorias.length + 1, activa: true,
        imagen: { origen: 'generado', arte: 'sudadera', tono: 'noche' }
      }, entrada));
      guardar('categorias');
      espejo('categorias', existente || datos.categorias[datos.categorias.length - 1]);
    },
    eliminarCategoria: function (id) {
      const cat = porId(datos.categorias, id);
      if (!cat) return { ok: false, mensaje: 'No existe.' };
      const usados = datos.productos.filter(function (p) { return p.categoria === cat.slug; }).length;
      if (usados > 0) {
        return { ok: false, mensaje: 'Tiene ' + usados + ' productos. Muévelos antes de eliminarla.' };
      }
      datos.categorias = datos.categorias.filter(function (c) { return c.id !== id; });
      guardar('categorias');
      espejo('categorias', { id: id }, true);
      return { ok: true };
    },

    /* ── Escritura: cupones ── */
    guardarCupon: function (entrada) {
      const existente = entrada.id ? porId(datos.cupones, entrada.id) : null;
      if (existente) Object.assign(existente, entrada);
      else datos.cupones.push(Object.assign({ id: uid('cup_'), usos: 0, creadoEn: hoyISO() }, entrada));
      guardar('cupones');
      espejo('cupones', existente || datos.cupones[datos.cupones.length - 1]);
    },
    eliminarCupon: function (id) {
      datos.cupones = datos.cupones.filter(function (c) { return c.id !== id; });
      guardar('cupones');
      espejo('cupones', { id: id }, true);
    },
    /** Devuelve { ok, cupon, descuento, mensaje }. La misma regla la aplicará Postgres. */
    validarCupon: function (codigo, subtotal) {
      const c = datos.cupones.find(function (x) {
        return x.codigo.toUpperCase() === String(codigo).trim().toUpperCase();
      });
      if (!c) return { ok: false, mensaje: 'Ese cupón no existe.' };
      if (!c.activo) return { ok: false, mensaje: 'Ese cupón ya no está activo.' };
      if (c.maxUsos > 0 && c.usos >= c.maxUsos) return { ok: false, mensaje: 'Ese cupón llegó a su límite de usos.' };
      if (subtotal < c.minimo) return { ok: false, mensaje: 'Aplica desde ' + precio(c.minimo) + ' de compra.' };
      const dcto = c.tipo === 'porcentaje' ? Math.round(subtotal * c.valor / 100) : Math.min(c.valor, subtotal);
      return { ok: true, cupon: c, descuento: dcto };
    },

    /* ── Escritura: pedidos ──
       Descontar inventario y registrar el pedido es una sola operación.
       En Supabase esto vive en la función `place_order`, dentro de una
       transacción, para que dos compras no vendan la misma última pieza. */
    crearPedido: function (borrador) {
      const lineas = borrador.items;
      for (let i = 0; i < lineas.length; i++) {
        const l = lineas[i];
        const p = porId(datos.productos, l.productoId);
        const v = p && p.variantes.find(function (x) { return x.color === l.color && x.talla === l.talla; });
        if (!v) return { ok: false, mensaje: 'Una de las piezas ya no está disponible.' };
        if (v.stock < l.cantidad) {
          return { ok: false, mensaje: 'De ' + p.nombre + ' talla ' + l.talla + ' solo ' +
            (v.stock === 1 ? 'queda 1 pieza' : 'quedan ' + v.stock + ' piezas') + '.' };
        }
      }
      lineas.forEach(function (l) {
        const p = porId(datos.productos, l.productoId);
        const v = p.variantes.find(function (x) { return x.color === l.color && x.talla === l.talla; });
        v.stock -= l.cantidad;
        p.actualizadoEn = hoyISO();
      });

      let cliente = datos.clientes.find(function (c) {
        return c.correo.toLowerCase() === String(borrador.cliente.correo).toLowerCase();
      });
      if (cliente) Object.assign(cliente, borrador.cliente);
      else {
        cliente = Object.assign({ id: uid('cli_'), creadoEn: hoyISO() }, borrador.cliente);
        datos.clientes.push(cliente);
      }

      if (borrador.cupon) {
        const c = datos.cupones.find(function (x) { return x.codigo === borrador.cupon; });
        if (c) c.usos += 1;
      }

      const numero = 'ONX-' + String(10429 + datos.pedidos.length).padStart(5, '0');
      const pedido = Object.assign({}, borrador, {
        id: uid('ped_'), numero: numero, clienteId: cliente.id,
        estado: 'pendiente', notas: '', creadoEn: hoyISO(), actualizadoEn: hoyISO()
      });
      datos.pedidos.unshift(pedido);
      guardar('pedidos');
      /* Con Supabase encendido el descuento de inventario y el alta del
         pedido los hace `crear_pedido` dentro de una transacción; lo de
         arriba es solo el reflejo optimista para que la vista responda ya. */
      if (Nube.activa()) {
        Nube.crearPedido(pedido).catch(function (e) {
          aviso('El pedido no llegó a Supabase: ' + e.message, true);
        });
      }
      return { ok: true, pedido: pedido };
    },
    /**
     * Borra un pedido. `devolver` reintegra las piezas al inventario:
     * lo correcto cuando se cancela algo que nunca salió del taller, y
     * lo incorrecto cuando ya se entregó.
     */
    eliminarPedido: function (id, devolver) {
      const pedido = porId(datos.pedidos, id);
      if (!pedido) return { ok: false, mensaje: 'Ese pedido ya no existe.' };
      if (devolver) {
        pedido.items.forEach(function (l) {
          const p = porId(datos.productos, l.productoId);
          if (!p) return;
          const v = p.variantes.find(function (x) { return x.color === l.color && x.talla === l.talla; });
          if (v) { v.stock += l.cantidad; p.actualizadoEn = hoyISO(); }
          espejo('productos', p);
        });
      }
      datos.pedidos = datos.pedidos.filter(function (x) { return x.id !== id; });
      guardar('pedidos');
      espejo('pedidos', { id: id }, true);
      return { ok: true, numero: pedido.numero };
    },

    cambiarEstadoPedido: function (id, estado) {
      const p = porId(datos.pedidos, id);
      if (!p) return;
      p.estado = estado;
      p.actualizadoEn = hoyISO();
      guardar('pedidos');
      espejo('pedidos', p);
    },

    /* ── Escritura: contenido ── */
    guardarContenido: function (parcial) {
      Object.keys(parcial).forEach(function (k) {
        datos.contenido[k] = Object.assign({}, datos.contenido[k], parcial[k]);
        espejo('contenido', { id: k, valor: datos.contenido[k] });
      });
      guardar('contenido');
    },
    guardarPromos: function (promos) {
      datos.contenido.promos = promos;
      guardar('contenido');
      espejo('contenido', { id: 'promos', valor: promos });
    },

    /** Sustituye todo el estado con lo que venga de Supabase al arrancar. */
    reemplazar: function (nuevos) {
      datos = Object.assign({}, datos, nuevos);
      escribir();
      avisar('*');
    },

    restaurar: function () { datos = fresco(); guardar('*'); }
  };
})();

/* ── Derivados del inventario ─────────────────────────────────
   El stock de un producto no se guarda: siempre es la suma de sus
   variantes. Así nunca puede contradecir al inventario real. */
function stockDe(p) {
  return (p.variantes || []).reduce(function (t, v) { return t + (Number(v.stock) || 0); }, 0);
}

function stockVariante(p, color, talla) {
  const v = (p.variantes || []).find(function (x) { return x.color === color && x.talla === talla; });
  return v ? Number(v.stock) || 0 : 0;
}

function estadoDe(p) {
  if (p.estado === 'borrador') return 'borrador';
  const s = stockDe(p);
  if (s === 0) return 'agotado';
  if (s <= 10) return 'ultimas-piezas';
  return 'disponible';
}

const TEXTO_DISPONIBILIDAD = {
  'disponible': 'Disponible', 'ultimas-piezas': 'Últimas piezas',
  'agotado': 'Agotado', 'borrador': 'Borrador'
};

function enOferta(p) { return descuento(p.precio, p.precioAntes) > 0; }

function colorDe(p, nombre) {
  return (p.colores || []).find(function (c) { return c.nombre === nombre; }) || (p.colores || [])[0] || null;
}

/**
 * Galería de un color. Si el color no trae fotos propias, cae en las
 * generales del producto: así ningún producto se queda sin imagen
 * mientras se sube el material real.
 */
function imagenesDe(p, nombreColor) {
  const c = colorDe(p, nombreColor);
  if (c && c.imagenes && c.imagenes.length) return c.imagenes;
  if (p.imagenes && p.imagenes.length) return p.imagenes;
  return [{ origen: 'generado', arte: 'accesorio', tono: 'noche' }];
}

/** Portada del producto: la primera foto del primer color con existencias. */
function portadaDe(p) {
  return imagenesDe(p, primerColorConStock(p))[0];
}

function primerColorConStock(p) {
  const v = (p.variantes || []).find(function (x) { return x.stock > 0; });
  return v ? v.color : (p.colores[0] ? p.colores[0].nombre : '');
}

function primerTallaConStock(p, color) {
  const v = (p.variantes || []).find(function (x) { return x.color === color && x.stock > 0; });
  return v ? v.talla : (p.tallas[0] || '');
}

/* ── 5. CARRITO Y FAVORITOS ───────────────────────────────────
   El carrito guarda referencias (producto + variante + cantidad),
   nunca una copia del producto. Por eso, si el panel cambia un
   precio, el carrito abierto muestra el precio nuevo. */
const Carrito = (function () {
  const CLAVE = 'onix.carrito.v1';
  let items = [];
  const oyentes = [];

  try {
    const crudo = window.localStorage.getItem(CLAVE);
    items = crudo ? JSON.parse(crudo) : [];
  } catch (e) { items = []; }

  function escribir() {
    try { window.localStorage.setItem(CLAVE, JSON.stringify(items)); } catch (e) {}
    oyentes.forEach(function (fn) { fn(); });
  }

  /** Resuelve cada línea contra el catálogo vivo y descarta lo que ya no existe. */
  function detalle() {
    const salida = [];
    let cambio = false;
    items.forEach(function (i) {
      const p = DB.producto(i.productoId);
      if (!p || p.estado !== 'activo') { cambio = true; return; }
      const disponible = stockVariante(p, i.color, i.talla);
      const cantidad = Math.min(i.cantidad, Math.max(disponible, 0));
      if (cantidad !== i.cantidad) cambio = true;
      if (cantidad <= 0) return;
      salida.push({
        productoId: p.id, slug: p.slug, nombre: p.nombre, sku: p.sku,
        imagen: imagenesDe(p, i.color)[0], precio: p.precio, precioAntes: p.precioAntes,
        color: i.color, talla: i.talla, cantidad: cantidad, disponible: disponible
      });
    });
    if (cambio) {
      items = salida.map(function (l) {
        return { productoId: l.productoId, color: l.color, talla: l.talla, cantidad: l.cantidad };
      });
      escribir();
    }
    return salida;
  }

  return {
    alCambiar: function (fn) { oyentes.push(fn); },
    lineas: detalle,
    piezas: function () { return detalle().reduce(function (t, i) { return t + i.cantidad; }, 0); },
    subtotal: function () { return detalle().reduce(function (t, i) { return t + i.precio * i.cantidad; }, 0); },
    agregar: function (producto, color, talla, cantidad) {
      cantidad = cantidad || 1;
      const disponible = stockVariante(producto, color, talla);
      if (disponible <= 0) return { ok: false, mensaje: 'Esa talla está agotada.' };
      const i = items.findIndex(function (x) {
        return x.productoId === producto.id && x.color === color && x.talla === talla;
      });
      const yaHay = i >= 0 ? items[i].cantidad : 0;
      if (yaHay + cantidad > disponible) {
        return { ok: false, mensaje: 'Solo ' + (disponible === 1 ? 'queda 1 pieza' : 'quedan ' + disponible + ' piezas') + ' de esa talla.' };
      }
      if (i >= 0) items[i].cantidad += cantidad;
      else items.push({ productoId: producto.id, color: color, talla: talla, cantidad: cantidad });
      escribir();
      return { ok: true };
    },
    actualizar: function (indice, cantidad) {
      const linea = detalle()[indice];
      if (!linea) return { ok: false };
      if (cantidad > linea.disponible) return { ok: false, mensaje: 'No hay más piezas de esa talla.' };
      const i = items.findIndex(function (x) {
        return x.productoId === linea.productoId && x.color === linea.color && x.talla === linea.talla;
      });
      if (i < 0) return { ok: false };
      items[i].cantidad = Math.max(0, cantidad);
      items = items.filter(function (x) { return x.cantidad > 0; });
      escribir();
      return { ok: true };
    },
    quitar: function (indice) {
      const linea = detalle()[indice];
      if (!linea) return;
      items = items.filter(function (x) {
        return !(x.productoId === linea.productoId && x.color === linea.color && x.talla === linea.talla);
      });
      escribir();
    },
    vaciar: function () { items = []; escribir(); }
  };
})();

const Favoritos = (function () {
  const CLAVE = 'onix.favoritos.v1';
  let ids = [];
  const oyentes = [];
  try {
    const crudo = window.localStorage.getItem(CLAVE);
    ids = crudo ? JSON.parse(crudo) : [];
  } catch (e) { ids = []; }

  function escribir() {
    try { window.localStorage.setItem(CLAVE, JSON.stringify(ids)); } catch (e) {}
    oyentes.forEach(function (fn) { fn(); });
  }

  return {
    alCambiar: function (fn) { oyentes.push(fn); },
    lista: function () { return ids.slice(); },
    tiene: function (id) { return ids.indexOf(id) !== -1; },
    total: function () { return ids.length; },
    alternar: function (id) {
      const i = ids.indexOf(id);
      if (i === -1) ids.push(id); else ids.splice(i, 1);
      escribir();
      return i === -1;
    }
  };
})();

/** Aclara (factor > 0) u oscurece (factor < 0) un color. */
function mezclar(hex, factor) {
  const h = String(hex).replace('#', '');
  const largo = h.length === 3 ? h.split('').map(function (c) { return c + c; }).join('') : h;
  const canal = function (i) {
    const v = parseInt(largo.substr(i * 2, 2), 16) || 0;
    const destino = factor > 0 ? 255 : 0;
    return Math.round(v + (destino - v) * Math.abs(factor));
  };
  return 'rgb(' + canal(0) + ',' + canal(1) + ',' + canal(2) + ')';
}

/** Construye el tono del dibujo a partir del color real de la prenda. */
function tonoDeColor(hex) {
  /* El trazo tiene que leerse sobre la tela, así que el umbral es el
     de contraste, no el de la escala de tonos. */
  const claro = luzDeHex(hex) > 0.5;
  return {
    fondo: 'linear-gradient(158deg,' + mezclar(hex, claro ? 0.55 : 0.22) + ' 0%,' + hex + ' 48%,' +
      mezclar(hex, -0.4) + ' 100%)',
    brillo: 'radial-gradient(60% 48% at 50% 34%,rgba(255,255,255,' + (claro ? '.5' : '.18') + ') 0%,transparent 70%)',
    trazo: claro ? mezclar(hex, -0.72) : mezclar(hex, 0.86),
    texto: claro ? 'var(--ink-500)' : 'var(--ink-100)'
  };
}

const ARTES = ['sudadera', 'playera', 'pantalon', 'chamarra', 'gorra', 'accesorio'];
const TONOS_LISTA = ['noche', 'humo', 'papel'];

/**
 * Único punto que decide de dónde sale una imagen. El día que una
 * fuente traiga URL —de Google Drive o de Supabase Storage— toda la
 * tienda muestra fotografía sin tocar una sola vista.
 */
function urlDeMedia(fuente) {
  if (!fuente) return null;
  if (fuente.origen === 'url') return fuente.url;
  if (fuente.origen === 'drive') return 'https://drive.google.com/uc?export=view&id=' + fuente.fileId;
  return null;
}

function media(fuente, op) {
  op = op || {};
  const ratio = op.ratio || 'retrato';
  const clase = 'media ' + ratio + (op.clase ? ' ' + op.clase : '');
  const alt = op.alt || '';
  const url = urlDeMedia(fuente);

  if (url) {
    return '<div class="' + clase + '"><img src="' + esc(url) + '" alt="' + esc(alt) +
      '" loading="lazy" decoding="async"></div>';
  }

  const arte = (fuente && fuente.arte) || 'accesorio';
  /* Con el color a la vista, la prenda se dibuja en ese color. Sin él,
     en uno de los tres tonos de la casa. */
  const tono = (fuente && fuente.hex) ? tonoDeColor(fuente.hex) : TONOS[(fuente && fuente.tono) || 'noche'];
  const giro = ((semilla(alt) % 7) - 3) * 0.12;
  /* La segunda toma de cada color es un acercamiento al cuello y al
     hombro: lo mismo que haría un fotógrafo con la prenda colgada. */
  const marco = (function () {
    const n = ENCUADRES[arte].split(' ').map(Number);
    if (!fuente || !fuente.detalle) return ENCUADRES[arte];
    return [n[0] + n[2] * 0.22, n[1] + n[3] * 0.02, n[2] * 0.56, n[3] * 0.42].join(' ');
  })();
  const trazos = (TRAZOS_PRENDA[arte] || TRAZOS_PRENDA.accesorio).map(function (d, i) {
    return '<path d="' + d + '" opacity="' + (i === 0 ? '1' : '.62') + '"/>';
  }).join('');

  return '<div class="' + clase + '" role="img" aria-label="' + esc(alt) + '">' +
    '<div class="fondo" style="background-image:' + tono.fondo + '"></div>' +
    '<div class="brillo" style="background-image:' + tono.brillo + '"></div>' +
    '<div class="tela" style="opacity:.7"></div>' +
    '<svg class="trazo" viewBox="' + marco + '" preserveAspectRatio="xMidYMid meet" aria-hidden="true" ' +
    'style="transform:rotate(' + giro + 'deg)">' +
    '<g fill="none" stroke="' + tono.trazo + '" stroke-width="1.6" stroke-linejoin="round" ' +
    'stroke-linecap="round" opacity=".92">' + trazos + '</g></svg>' +
    (op.codigo ? '<span class="codigo etiqueta-sm" style="color:' + tono.texto + '">' + esc(op.codigo) + '</span>' : '') +
    '</div>';
}

/* ── Avisos flotantes ─────────────────────────────────────── */
function aviso(texto, mal) {
  const caja = document.getElementById('avisos');
  if (!caja) return;
  const nodo = document.createElement('div');
  nodo.className = 'aviso-flotante etiqueta' + (mal ? ' mal' : '');
  nodo.setAttribute('role', 'status');
  nodo.innerHTML = icono(mal ? 'aviso' : 'cheque', 18) + '<span>' + esc(texto) + '</span>';
  caja.appendChild(nodo);
  setTimeout(function () {
    nodo.style.transition = 'opacity .3s';
    nodo.style.opacity = '0';
    setTimeout(function () { nodo.remove(); }, 320);
  }, 2600);
}

/* ── 6 bis. LA NUBE ───────────────────────────────────────────
   Adaptador de Supabase. Mientras `env.js` no exista, `activa()`
   devuelve false y toda la tienda sigue funcionando contra el
   navegador: no hay dos versiones del código, solo dos orígenes.

   PostgREST usa snake_case y el modelo del archivo usa camelCase,
   así que la conversión vive aquí y en ningún otro sitio.
   ────────────────────────────────────────────────────────────── */
const ENV = window.ONIX_ENV || {};

function aSnake(objeto) {
  const salida = {};
  Object.keys(objeto).forEach(function (k) {
    salida[k.replace(/[A-Z]/g, function (c) { return '_' + c.toLowerCase(); })] = objeto[k];
  });
  return salida;
}

function aCamel(fila) {
  const salida = {};
  Object.keys(fila).forEach(function (k) {
    salida[k.replace(/_([a-z])/g, function (_, c) { return c.toUpperCase(); })] = fila[k];
  });
  return salida;
}

const Nube = (function () {
  const url = String(ENV.SUPABASE_URL || '').replace(/\/$/, '');
  const llave = ENV.SUPABASE_ANON_KEY || '';
  const bucket = ENV.SUPABASE_BUCKET || 'productos';
  let sesion = null;

  try {
    const crudo = window.localStorage.getItem('onix.nube.v1');
    if (crudo) sesion = JSON.parse(crudo);
  } catch (e) { sesion = null; }

  function activa() { return !!(url && llave); }

  function cabeceras(extra) {
    return Object.assign({
      apikey: llave,
      Authorization: 'Bearer ' + ((sesion && sesion.access_token) || llave),
      'Content-Type': 'application/json'
    }, extra || {});
  }

  async function pedir(ruta, opciones) {
    const r = await fetch(url + ruta, opciones);
    if (!r.ok) {
      const detalle = await r.text();
      throw new Error('Supabase ' + r.status + ': ' + detalle.slice(0, 200));
    }
    return r.status === 204 ? null : r.json();
  }

  async function tabla(nombre) {
    const filas = await pedir('/rest/v1/' + nombre + '?select=*', { headers: cabeceras() });
    return filas.map(aCamel);
  }

  return {
    activa: activa,
    bucket: bucket,
    origen: function () { return activa() ? 'Supabase' : 'navegador (localStorage)'; },
    usuario: function () { return sesion && sesion.user ? sesion.user.email : null; },

    /** Trae el estado completo. Se llama una vez al arrancar. */
    cargarTodo: async function () {
      const [categorias, productos, clientes, pedidos, cupones, contenido] = await Promise.all([
        tabla('categorias'), tabla('productos'), tabla('clientes'),
        tabla('pedidos'), tabla('cupones'), tabla('contenido')
      ]);
      const armado = {};
      contenido.forEach(function (fila) { armado[fila.id] = fila.valor; });
      return {
        categorias: categorias, productos: productos, clientes: clientes,
        pedidos: pedidos.sort(function (a, b) { return String(b.creadoEn).localeCompare(String(a.creadoEn)); }),
        cupones: cupones,
        contenido: armado
      };
    },

    /** Alta o actualización por clave primaria. */
    guardar: function (nombreTabla, fila) {
      return pedir('/rest/v1/' + nombreTabla, {
        method: 'POST',
        headers: cabeceras({ Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify(aSnake(fila))
      });
    },

    borrar: function (nombreTabla, id) {
      return pedir('/rest/v1/' + nombreTabla + '?id=eq.' + encodeURIComponent(id), {
        method: 'DELETE', headers: cabeceras({ Prefer: 'return=minimal' })
      });
    },

    /** El pedido entra por la función transaccional, nunca por INSERT directo. */
    crearPedido: function (carga) {
      return pedir('/rest/v1/rpc/crear_pedido', {
        method: 'POST', headers: cabeceras(), body: JSON.stringify({ carga: carga })
      });
    },

    entrar: async function (correo, clave) {
      const r = await fetch(url + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: { apikey: llave, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: correo, password: clave })
      });
      if (!r.ok) return { ok: false, mensaje: 'Correo o contraseña incorrectos.' };
      sesion = await r.json();
      try { window.localStorage.setItem('onix.nube.v1', JSON.stringify(sesion)); } catch (e) {}
      return { ok: true };
    },

    salir: function () {
      sesion = null;
      try { window.localStorage.removeItem('onix.nube.v1'); } catch (e) {}
    },

    /** Sube un archivo al bucket y devuelve su dirección pública. */
    subir: async function (archivo) {
      const ruta = Date.now().toString(36) + '-' + slugify(archivo.name.replace(/\.[^.]+$/, '')) +
        (archivo.name.match(/\.[^.]+$/) || [''])[0];
      const r = await fetch(url + '/storage/v1/object/' + bucket + '/' + ruta, {
        method: 'POST',
        headers: {
          apikey: llave,
          Authorization: 'Bearer ' + ((sesion && sesion.access_token) || llave),
          'Content-Type': archivo.type || 'application/octet-stream'
        },
        body: archivo
      });
      if (!r.ok) throw new Error('No se pudo subir: ' + r.status);
      return url + '/storage/v1/object/public/' + bucket + '/' + ruta;
    }
  };
})();

/* ── 6 ter. GOOGLE DRIVE ──────────────────────────────────────
   El Picker solo elige el archivo; la tienda se queda con una
   referencia. Recomendación: al elegir, copiar el archivo a
   Storage —Drive no es un CDN y sus enlaces caducan—; para eso
   está `Drive.copiarAStorage`.

   OJO: OAuth no funciona desde file://. En cuanto configures las
   llaves, el panel necesita servidor (`npx serve .`).
   ────────────────────────────────────────────────────────────── */
const Drive = (function () {
  const idCliente = ENV.GOOGLE_CLIENT_ID || '';
  const llaveApi = ENV.GOOGLE_API_KEY || '';
  const AMBITO = 'https://www.googleapis.com/auth/drive.file';
  let token = null;

  function configurado() { return !!(idCliente && llaveApi); }

  function cargarGuion(src) {
    return new Promise(function (listo, falla) {
      if (document.querySelector('script[src="' + src + '"]')) return listo();
      const g = document.createElement('script');
      g.src = src; g.async = true; g.onload = listo; g.onerror = falla;
      document.head.appendChild(g);
    });
  }

  async function autorizar() {
    if (token) return token;
    await cargarGuion('https://accounts.google.com/gsi/client');
    return new Promise(function (listo, falla) {
      const cliente = window.google.accounts.oauth2.initTokenClient({
        client_id: idCliente, scope: AMBITO,
        callback: function (r) { token = r.access_token; token ? listo(token) : falla(new Error('Sin permiso')); }
      });
      cliente.requestAccessToken();
    });
  }

  return {
    configurado: configurado,

    /** Abre el selector y devuelve { fileId, nombre, url } o null. */
    elegir: async function () {
      if (!configurado()) throw new Error('Faltan GOOGLE_CLIENT_ID y GOOGLE_API_KEY en env.js.');
      const acceso = await autorizar();
      await cargarGuion('https://apis.google.com/js/api.js');
      await new Promise(function (listo) { window.gapi.load('picker', listo); });
      return new Promise(function (listo) {
        const vista = new window.google.picker.DocsView(window.google.picker.ViewId.DOCS_IMAGES)
          .setIncludeFolders(true).setSelectFolderEnabled(false);
        new window.google.picker.PickerBuilder()
          .addView(vista)
          .setOAuthToken(acceso)
          .setDeveloperKey(llaveApi)
          .setCallback(function (datos) {
            if (datos.action === window.google.picker.Action.PICKED) {
              const doc = datos.docs[0];
              listo({ fileId: doc.id, nombre: doc.name, url: doc.url, acceso: acceso });
            } else if (datos.action === window.google.picker.Action.CANCEL) {
              listo(null);
            }
          }).build().setVisible(true);
      });
    },

    /** Descarga el archivo de Drive y lo deja en Storage, que sí es un CDN. */
    copiarAStorage: async function (elegido) {
      const r = await fetch('https://www.googleapis.com/drive/v3/files/' + elegido.fileId + '?alt=media', {
        headers: { Authorization: 'Bearer ' + elegido.acceso }
      });
      if (!r.ok) throw new Error('No se pudo leer el archivo de Drive.');
      const blob = await r.blob();
      blob.name = elegido.nombre;
      return Nube.subir(blob);
    }
  };
})();


/* ── 6 quater. PAGOS ──────────────────────────────────────────
   La llave secreta de la pasarela no puede vivir en el navegador,
   así que el cobro lo arma una función en el servidor
   (`api/crear-preferencia.js`) y lo confirma un webhook. Aquí solo
   se sabe si está encendida y a dónde mandar al comprador.
   ────────────────────────────────────────────────────────────── */
const PAGOS = {
  pasarela: ENV.PASARELA || '',
  activo: !!ENV.PASARELA,
  ruta: ENV.RUTA_PAGO || '/api/crear-preferencia',

  /** Devuelve la dirección a la que hay que enviar al comprador. */
  iniciar: async function (pedido) {
    const r = await fetch(PAGOS.ruta, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(pedido)
    });
    if (!r.ok) throw new Error('No se pudo iniciar el cobro (' + r.status + ').');
    const datos = await r.json();
    if (!datos.url) throw new Error('El servidor no devolvió una dirección de pago.');
    return datos.url;
  }
};

const ORDENES = [
  { valor: 'destacados', etiqueta: 'Destacados' },
  { valor: 'nuevo', etiqueta: 'Más recientes' },
  { valor: 'precio-asc', etiqueta: 'Precio: menor a mayor' },
  { valor: 'precio-desc', etiqueta: 'Precio: mayor a menor' },
  { valor: 'descuento', etiqueta: 'Mayor descuento' }
];

const DISPONIBILIDAD = [
  { valor: 'disponible', etiqueta: 'Disponible' },
  { valor: 'ultimas-piezas', etiqueta: 'Últimas piezas' },
  { valor: 'agotado', etiqueta: 'Agotado' }
];

function rangoPrecios(lista) {
  if (!lista.length) return { min: 0, max: 1000 };
  return {
    min: Math.min.apply(null, lista.map(function (p) { return p.precio; })),
    max: Math.max.apply(null, lista.map(function (p) { return p.precio; }))
  };
}

function tallasDe(lista) {
  const vistas = [];
  lista.forEach(function (p) {
    p.tallas.forEach(function (t) { if (vistas.indexOf(t) === -1) vistas.push(t); });
  });
  return vistas;
}

function coloresDe(lista) {
  const vistos = [];
  lista.forEach(function (p) {
    (p.colores || []).forEach(function (c) {
      if (!vistos.some(function (x) { return x.nombre === c.nombre; })) vistos.push(c);
    });
  });
  return vistos;
}

function filtrarProductos(lista, f) {
  const texto = sinAcentos(f.consulta).trim();
  const filtrada = lista.filter(function (p) {
    if (f.categorias.length && f.categorias.indexOf(p.categoria) === -1) return false;
    if (f.precioMax != null && p.precio > f.precioMax) return false;
    if (f.disponibilidad.length && f.disponibilidad.indexOf(estadoDe(p)) === -1) return false;
    if (f.soloOfertas && !enOferta(p)) return false;
    if (f.tallas.length && !p.tallas.some(function (t) { return f.tallas.indexOf(t) !== -1; })) return false;
    if (f.colores.length && !(p.colores || []).some(function (c) { return f.colores.indexOf(c.nombre) !== -1; })) return false;
    if (texto) {
      const indice = sinAcentos(p.nombre + ' ' + p.resumen + ' ' + p.categoria + ' ' + p.corte + ' ' + p.composicion + ' ' + p.sku);
      if (indice.indexOf(texto) === -1) return false;
    }
    return true;
  });

  const orden = f.orden;
  return filtrada.sort(function (a, b) {
    if (orden === 'precio-asc') return a.precio - b.precio;
    if (orden === 'precio-desc') return b.precio - a.precio;
    if (orden === 'nuevo') return String(b.creadoEn).localeCompare(String(a.creadoEn));
    if (orden === 'descuento') return descuento(b.precio, b.precioAntes) - descuento(a.precio, a.precioAntes);
    return (Number(b.destacado) - Number(a.destacado)) || (b.valoracion - a.valoracion);
  });
}

function casilla(op) {
  return '<label class="casilla"><span class="izq">' +
    '<input type="checkbox" data-filtro="' + op.grupo + '" value="' + esc(op.valor) + '"' +
      (op.marcada ? ' checked' : '') + '>' +
    '<span class="tilde" aria-hidden="true"></span>' + esc(op.texto) + '</span>' +
    (op.cuenta != null ? '<span class="cuenta etiqueta-sm cifra">' + op.cuenta + '</span>' : '') + '</label>';
}

function panelFiltros(f, base) {
  const conteos = base.reduce(function (acc, p) {
    acc[p.categoria] = (acc[p.categoria] || 0) + 1; return acc;
  }, {});
  const rango = rangoPrecios(base);
  const max = f.precioMax == null ? rango.max : f.precioMax;

  return '<div class="filtros">' +
    '<fieldset><legend class="etiqueta">Categoría</legend>' +
      DB.categorias(true).map(function (c) {
        return casilla({ grupo: 'categoria', valor: c.slug, texto: c.nombre,
          marcada: f.categorias.indexOf(c.slug) !== -1, cuenta: conteos[c.slug] || 0 });
      }).join('') + '</fieldset>' +
    '<div class="costura" style="margin-block:1.75rem"></div>' +
    '<fieldset><legend class="etiqueta">Precio máximo</legend>' +
      '<input class="rango" type="range" data-filtro="precio" aria-label="Precio máximo" min="' +
        rango.min + '" max="' + rango.max + '" step="50" value="' + max + '">' +
      '<div class="rango-pie"><span class="min etiqueta-sm cifra">' + precio(rango.min) + '</span>' +
      '<span class="max cifra">' + precio(max) + '</span></div></fieldset>' +
    '<div class="costura" style="margin-block:1.75rem"></div>' +
    '<fieldset><legend class="etiqueta">Talla</legend><div class="opciones">' +
      tallasDe(base).map(function (t) {
        const on = f.tallas.indexOf(t) !== -1;
        return '<button class="talla cifra" type="button" data-accion="filtro-talla" data-valor="' + esc(t) +
          '" aria-pressed="' + on + '" style="height:2.5rem;min-width:2.75rem">' + esc(t) + '</button>';
      }).join('') + '</div></fieldset>' +
    '<div class="costura" style="margin-block:1.75rem"></div>' +
    '<fieldset><legend class="etiqueta">Color</legend><div class="opciones">' +
      coloresDe(base).map(function (c) {
        const on = f.colores.indexOf(c.nombre) !== -1;
        return '<button class="color" type="button" data-accion="filtro-color" data-valor="' + esc(c.nombre) +
          '" aria-pressed="' + on + '" aria-label="' + esc(c.nombre) + '" style="width:2.25rem;height:2.25rem">' +
          '<span style="background:' + c.hex + ';width:1.375rem;height:1.375rem"></span></button>';
      }).join('') + '</div></fieldset>' +
    '<div class="costura" style="margin-block:1.75rem"></div>' +
    '<fieldset><legend class="etiqueta">Disponibilidad</legend>' +
      DISPONIBILIDAD.map(function (d) {
        return casilla({ grupo: 'estado', valor: d.valor, texto: d.etiqueta,
          marcada: f.disponibilidad.indexOf(d.valor) !== -1 });
      }).join('') + '</fieldset>' +
    '<div class="costura" style="margin-block:1.75rem"></div>' +
    casilla({ grupo: 'ofertas', valor: '1', texto: 'Solo con descuento', marcada: f.soloOfertas }) +
  '</div>';
}

function filtrosActivos(f, base) {
  const rango = rangoPrecios(base);
  return f.categorias.length + f.disponibilidad.length + f.tallas.length + f.colores.length +
    (f.soloOfertas ? 1 : 0) + (f.precioMax != null && f.precioMax < rango.max ? 1 : 0);
}

/** Conserva los filtros mientras no cambie la dirección. */
function asegurarCatalogo(clave, productos, conFiltros, iniciales) {
  if (!estado.catalogo || estado.catalogo.clave !== clave) {
    estado.catalogo = { clave: clave, productos: productos, conFiltros: conFiltros, filtros: iniciales };
  } else {
    estado.catalogo.productos = productos;
  }
}

function bloqueCatalogo() {
  const c = estado.catalogo;
  const f = c.filtros;
  const resultados = filtrarProductos(c.productos, f);
  const activos = filtrosActivos(f, c.productos);

  return '<div class="catalogo' + (c.conFiltros ? ' con-filtros' : '') + '">' +
    (c.conFiltros ? '<aside class="panel-filtros"><div class="pegado">' +
      '<div class="filtros-cabeza" id="filtros-cabeza"><p class="etiqueta">Filtros</p>' +
      (activos > 0 ? '<button class="etiqueta link-sub" type="button" data-accion="limpiar-filtros" style="color:var(--ink-500)">Limpiar (' + activos + ')</button>' : '') +
      '</div>' + panelFiltros(f, c.productos) + '</div></aside>' : '') +
    '<div>' +
      '<div class="barra-catalogo">' +
        '<div class="busca">' + icono('buscar', 18) +
          '<label class="sr" for="busca-catalogo">Buscar dentro de los resultados</label>' +
          '<input id="busca-catalogo" type="search" data-filtro="consulta" placeholder="Buscar en resultados" value="' + esc(f.consulta) + '"></div>' +
        '<div class="barra-derecha">' +
          '<p class="conteo etiqueta cifra" id="conteo">' + plural(resultados.length, 'pieza') + '</p>' +
          '<div class="controles">' +
            (c.conFiltros ? '<button class="boton-filtros etiqueta" type="button" data-accion="abrir-filtros">' +
              icono('filtro', 16) + 'Filtros' + (activos > 0 ? ' (' + activos + ')' : '') + '</button>' : '') +
            '<label class="sr" for="orden">Ordenar por</label>' +
            '<select class="select-orden etiqueta" id="orden" data-filtro="orden">' +
              ORDENES.map(function (o) {
                return '<option value="' + o.valor + '"' + (o.valor === f.orden ? ' selected' : '') + '>' + o.etiqueta + '</option>';
              }).join('') + '</select>' +
          '</div></div></div>' +
      '<div id="resultados">' + rejillaProductos(resultados, 3) + '</div>' +
    '</div></div>';
}

function refrescarCatalogo() {
  const c = estado.catalogo;
  if (!c) return;
  const resultados = filtrarProductos(c.productos, c.filtros);
  const caja = document.getElementById('resultados');
  const conteo = document.getElementById('conteo');
  if (caja) caja.innerHTML = rejillaProductos(resultados, 3);
  if (conteo) conteo.textContent = plural(resultados.length, 'pieza');
  const max = document.querySelector('.rango-pie .max');

/**
 * Sin efectos secundarios: pintar no debe cambiar el estado. Si el cupón
 * dejó de aplicar —porque el carrito bajó del mínimo, por ejemplo— se
 * devuelve el motivo y la vista lo dice, en vez de descontarlo en silencio.
 */
function totalesCarrito() {
  const c = cfg();
  const subtotal = Carrito.subtotal();
  const cupon = estado.pago.cuponAplicado;
  let dcto = 0;
  let motivo = '';
  if (cupon) {
    const v = DB.validarCupon(cupon.codigo, subtotal);
    if (v.ok) dcto = v.descuento; else motivo = v.mensaje;
  }
  const base = subtotal - dcto;
  const envio = subtotal === 0 ? 0 : (base >= c.envioGratisDesde ? 0 : c.costoEnvio);
  return {
    subtotal: subtotal, descuento: dcto, envio: envio, total: base + envio,
    falta: Math.max(0, c.envioGratisDesde - base), motivo: motivo
  };
}

/* ── Resumen ──────────────────────────────────────────────── */
function ventasPorDia(pedidos, dias) {
  const salida = [];
  for (let i = dias - 1; i >= 0; i--) {
    const d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() - i);
    const siguiente = new Date(d);
    siguiente.setDate(siguiente.getDate() + 1);
    const total = pedidos.filter(function (p) {
      const f = new Date(p.creadoEn);
      return p.estado !== 'cancelado' && f >= d && f < siguiente;
    }).reduce(function (t, p) { return t + p.total; }, 0);
    salida.push({ dia: String(d.getDate()).padStart(2, '0'), total: total });
  }
  return salida;
}

function vistaAdminInicio() {
  const pedidos = DB.pedidos();
  const productos = DB.productos({ todos: true });
  const clientes = DB.clientes();
  const serie = ventasPorDia(pedidos, 12);
  const maximo = Math.max.apply(null, serie.map(function (d) { return d.total; }).concat([1]));
  const validos = pedidos.filter(function (p) { return p.estado !== 'cancelado'; });
  const ventas = validos.reduce(function (t, p) { return t + p.total; }, 0);
  const ticket = validos.length ? Math.round(ventas / validos.length) : 0;
  const pendientes = pedidos.filter(function (p) { return p.estado === 'pendiente' || p.estado === 'confirmado'; }).length;
  const bajos = productos.filter(function (p) { return stockDe(p) > 0 && stockDe(p) <= 10; });
  const agotados = productos.filter(function (p) { return stockDe(p) === 0; });
  const masVendidos = {};
  validos.forEach(function (p) {
    p.items.forEach(function (i) {
      masVendidos[i.nombre] = (masVendidos[i.nombre] || 0) + i.cantidad;
    });

/* Regenera la matriz color × talla conservando el stock ya capturado. */
function recalcularVariantes(forma) {
  const previas = forma.variantes || [];
  const nuevas = [];
  forma.colores.forEach(function (color) {
    forma.tallas.forEach(function (talla) {
      const vieja = previas.find(function (v) { return v.color === color.nombre && v.talla === talla; });
      nuevas.push(vieja || {
        color: color.nombre, talla: talla, stock: 0,
        sku: (forma.sku || 'ONX') + '-' + sinAcentos(color.nombre).slice(0, 3).toUpperCase() + '-' + String(talla).toUpperCase()
      });
    });
  });
  forma.variantes = nuevas;
}

/* ── Clientes ─────────────────────────────────────────────── */
function vistaAdminClientes() {
  const clientes = DB.clientes();
  const pedidos = DB.pedidos();

  const filas = clientes.map(function (c) {
    const suyos = pedidos.filter(function (p) { return p.clienteId === c.id && p.estado !== 'cancelado'; });
    const gastado = suyos.reduce(function (t, p) { return t + p.total; }, 0);
    return { c: c, pedidos: suyos.length, gastado: gastado, ultimo: suyos[0] ? suyos[0].creadoEn : null };
  }).sort(function (a, b) { return b.gastado - a.gastado; });

  const contenido = cabeceraAdmin('Clientes',
    'Se dan de alta solos al confirmar un pedido. Nadie los lee desde el navegador salvo el administrador.') +
    '<div class="panel"><div class="tabla-envoltura"><table class="tabla" style="min-width:46rem"><thead><tr>' +

      '<th class="etiqueta der">Pedidos</th><th class="etiqueta der">Gastado</th><th class="etiqueta">Último</th>' +
    '</tr></thead><tbody>' + filas.map(function (f) {

        '<td class="der cifra">' + f.pedidos + '</td>' +

        '<td class="apagado cifra">' + (f.ultimo ? fechaCorta(f.ultimo) : '—') + '</td></tr>';
