/* ── 10. ENRUTADOR ────────────────────────────────────────── */
const app = document.getElementById('app');
let ultimaRuta = null;
let pintando = false;

function partesRuta() {
  const bruto = location.hash || '#/';
  const corte = bruto.indexOf('?');
  const camino = corte === -1 ? bruto : bruto.slice(0, corte);
  const consulta = corte === -1 ? '' : bruto.slice(corte + 1);
  const params = {};
  consulta.split('&').forEach(function (par) {
    if (!par) return;
    const t = par.split('=');
    params[decodeURIComponent(t[0])] = decodeURIComponent((t[1] || '').replace(/\+/g, ' '));
  });
  return { camino: camino, params: params, segmentos: camino.replace(/^#\//, '').split('/').filter(Boolean) };
}

function vistaDeRuta(r) {
  const s = r.segmentos;

  if (s[0] === 'admin') {
    /* Puerta del panel. Hoy vive en el navegador; mañana la sostienen
       Supabase Auth y las políticas RLS, que es donde debe estar. */
    if (s[1] === 'entrar') return Auth.dentro() ? (location.hash = '#/admin', '') : vistaAcceso(estado.errorAcceso);
    if (!Auth.dentro()) return vistaAcceso(estado.errorAcceso);
    if (!s[1]) return vistaAdminInicio();
    if (s[1] === 'productos' && s[2] === 'nuevo') return vistaAdminNuevo(r.params.editar);
    if (s[1] === 'productos') return vistaAdminProductos();
    if (s[1] === 'inventario') return vistaAdminInventario();
    if (s[1] === 'pedidos') return vistaAdminPedidos();
    if (s[1] === 'clientes') return vistaAdminClientes();
    if (s[1] === 'categorias') return vistaAdminCategorias();
    if (s[1] === 'cupones') return vistaAdminCupones();
    if (s[1] === 'portada') return vistaAdminPortada();
    if (s[1] === 'configuracion') return vistaAdminConfiguracion();
    return marcoAdmin('#/admin', vistaNoEncontrado());
  }

  if (!s.length) return vistaInicio();
  if (s[0] === 'productos') return s[1] ? vistaProducto(s[1]) : vistaCatalogo(r.params.q, r.params.orden);
  if (s[0] === 'categorias' && s[1]) return vistaCategoria(s[1]);
  if (s[0] === 'ofertas') return vistaOfertas();
  if (s[0] === 'favoritos') return vistaFavoritos();
  if (s[0] === 'buscar') return vistaBuscar(r.params.q || '');
  if (s[0] === 'contacto') return vistaContacto();
  if (s[0] === 'carrito') return vistaCarrito();
  if (s[0] === 'pago') return vistaPago();
  if (s[0] === 'pedido' && s[1]) return vistaPedido(s[1]);
  return vistaNoEncontrado();
}

function tituloDeRuta(r) {
  const nombre = cfg().nombre;
  const base = ' · ' + nombre;
  const s = r.segmentos;
  if (!s.length) return nombre + ' · ' + cfg().claim;
  if (s[0] === 'admin') return 'Panel' + base;
  if (s[0] === 'productos' && s[1]) {
    const p = DB.producto(s[1]);
    return (p ? p.nombre : 'Producto') + base;
  }
  const titulos = {
    productos: 'Tienda', ofertas: 'Ofertas', favoritos: 'Favoritos', buscar: 'Búsqueda',
    contacto: 'Contacto', carrito: 'Carrito', pago: 'Pago', pedido: 'Pedido'
  };
  if (s[0] === 'categorias' && s[1]) {
    const c = DB.categoria(s[1]);
    return (c ? c.nombre : 'Categoría') + base;
  }
  return (titulos[s[0]] || 'Página no encontrada') + base;
}

/* Los buscadores y las vistas previas de WhatsApp leen esto. Con rutas
   de hash solo se puede actualizar en caliente; para tener meta por
   producto de verdad hacen falta URLs limpias (ver PENDIENTES.md). */
function metaDeRuta(r) {
  const c = cfg();
  const s = r.segmentos;
  if (s[0] === 'productos' && s[1]) {
    const p = DB.producto(s[1]);
    if (p) return p.resumen + ' ' + precio(p.precio) + '. ' + c.claim;
  }
  if (s[0] === 'categorias' && s[1]) {
    const cat = DB.categoria(s[1]);
    if (cat) return cat.descripcion;
  }
  if (s[0] === 'ofertas') return 'Piezas de temporadas anteriores con descuento, hasta agotar existencias.';
  if (s[0] === 'contacto') return 'Atención a clientes de ' + c.nombre + '. ' + c.horario + '.';
  return c.descripcion;
}

function ponerMeta(nombre, valor, propiedad) {
  const atributo = propiedad ? 'property' : 'name';
  let etiqueta = document.head.querySelector('meta[' + atributo + '="' + nombre + '"]');
  if (!etiqueta) {
    etiqueta = document.createElement('meta');
    etiqueta.setAttribute(atributo, nombre);
    document.head.appendChild(etiqueta);
  }
  etiqueta.setAttribute('content', valor);
}

function pintar(nuevaRuta) {
  if (pintando) return;
  pintando = true;

  const r = partesRuta();
  estado.ruta = r.camino;
  const esAdmin = r.segmentos[0] === 'admin';

  if (nuevaRuta) {
    estado.menuAbierto = false;
    estado.buscadorAbierto = false;
    estado.modal = null;
    estado.catalogo = null;
    estado.errorAcceso = null;
    estado.contacto = { enviado: false, errores: {}, valores: {}, faq: null };
    if (!esAdmin) estado.admin = null;
  }

  /* Repintar sustituye todo el árbol, así que hay que devolver la página
     donde estaba: sin esto, abrir un acordeón al final de una ficha larga
     te lanza a otra parte de la página. */
  const yPrevio = window.scrollY;
  const foco = document.activeElement;
  const marcaFoco = foco && foco !== document.body ? {
    id: foco.id || '',
    accion: foco.dataset ? (foco.dataset.accion || '') : '',
    valor: foco.dataset ? (foco.dataset.valor || foco.dataset.indice || foco.dataset.id || '') : '',
    caret: typeof foco.selectionStart === 'number' ? foco.selectionStart : null
  } : null;

  const contenido = vistaDeRuta(r);

  app.innerHTML = esAdmin
    ? contenido + vistaModal()
    : '<a class="saltar etiqueta" href="#contenido">Saltar al contenido</a>' +
      vistaHeader() + '<main id="contenido">' + contenido + '</main>' + vistaPie() +
      vistaMenuMovil() + vistaModal() + vistaCookies();

  const titulo = tituloDeRuta(r);
  const descripcion = metaDeRuta(r);
  document.title = titulo;
  ponerMeta('description', descripcion);
  ponerMeta('og:title', titulo, true);
  ponerMeta('og:description', descripcion, true);
  ponerMeta('og:type', r.segmentos[0] === 'productos' && r.segmentos[1] ? 'product' : 'website', true);
  ponerMeta('og:url', location.href, true);
  document.body.style.overflow = (estado.menuAbierto || estado.modal) ? 'hidden' : '';

  /* El aviso inferior cambia de alto según el ancho de pantalla, así que
     los mensajes se apartan midiéndolo, no con una cifra fija. */
  const barra = app.querySelector('.cookies');
  const cajaAvisos = document.getElementById('avisos');
  if (cajaAvisos) {
    cajaAvisos.style.bottom = barra ? (barra.getBoundingClientRect().height + 28) + 'px' : '';
  }

  const capa = capaActiva();
  const autofoco = app.querySelector('[data-autofoco]');
  if (autofoco) autofoco.focus();
  else if (capa && !capa.contains(document.activeElement)) {
    /* Al abrir un diálogo el foco entra en él; si no, el teclado se
       queda navegando por detrás de la capa oscura. */
    const primero = capa.querySelector('input:not([type="hidden"]),select,textarea,button,a[href]');
    if (primero) primero.focus({ preventScroll: true });
  } else if (marcaFoco) devolverFoco(marcaFoco);

  if (nuevaRuta) window.scrollTo(0, 0);
  else if (window.scrollY !== yPrevio) sinAnimacion(function () { window.scrollTo(0, yPrevio); });
  pintando = false;
}

/** El diálogo abierto, si lo hay: modal, menú de la tienda o del panel. */
function capaActiva() {
  return app.querySelector('.modal .caja') || app.querySelector('.drawer .panel') ||
    app.querySelector('.admin-drawer .panel');
}

/** Reposiciona sin la animación suave, que aquí solo se vería como un tirón. */
function sinAnimacion(accion) {
  const raiz = document.documentElement;
  const previo = raiz.style.scrollBehavior;
  raiz.style.scrollBehavior = 'auto';
  accion();
  raiz.style.scrollBehavior = previo;
}

/** Devuelve el foco al control equivalente del árbol nuevo. */
function devolverFoco(marca) {
  let destino = null;
  if (marca.id) destino = document.getElementById(marca.id);
  if (!destino && marca.accion) {
    const sel = '[data-accion="' + marca.accion + '"]' +
      (marca.valor ? '[data-valor="' + marca.valor + '"],[data-accion="' + marca.accion + '"][data-indice="' + marca.valor + '"]' : '');
    destino = app.querySelector(sel);
  }
  if (!destino) return;
  destino.focus({ preventScroll: true });
  if (marca.caret != null && typeof destino.setSelectionRange === 'function') {
    try { destino.setSelectionRange(marca.caret, marca.caret); } catch (e) { /* tipo sin selección */ }
  }
}

/* La tienda solo guarda lo que el propio comprador pidió (carrito,
   favoritos), así que el aviso es informativo, no un consentimiento
   de rastreo. Si mañana entra analítica, hay que pedir permiso ANTES
   de cargarla; ver PENDIENTES.md. */
function vistaCookies() {
  let visto = false;
  try { visto = window.localStorage.getItem('onix.cookies.v1') === '1'; } catch (e) { visto = true; }
  if (visto) return '';
  return '<div class="cookies" role="region" aria-label="Aviso de almacenamiento">' +
    '<p>Guardamos tu carrito y tus favoritos en este navegador. Nada más, y nada sale de tu equipo.</p>' +
    '<div class="acciones-cookies">' +
      '<a class="etiqueta link-sub" href="#/contacto">Aviso de privacidad</a>' +
      '<button class="boton claro chico" type="button" data-accion="cookies-ok">Entendido</button>' +
    '</div></div>';
}

/* ── Sincronización parcial ───────────────────────────────── */
function normalizarHex(valor) {
  const v = String(valor || '').trim();
  const m = v.match(/^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/);
  if (!m) return null;
  const h = m[1].length === 3 ? m[1].split('').map(function (c) { return c + c; }).join('') : m[1];
  return '#' + h.toLowerCase();
}

/** Un color nuevo nace con su dibujo en el tono que le toca por luminosidad. */
function nuevoColor(nombre, hex, forma) {
  const arte = (forma.imagenes[0] && forma.imagenes[0].arte) || 'accesorio';
  return { nombre: nombre, hex: hex, imagenes: imagenesDeColor(hex, arte) };
}

function actualizarGaleria() {
  const p = DB.producto(estado.producto.slug);
  const caja = document.getElementById('galeria');
  if (caja && p) caja.innerHTML = galeriaProducto(p);
}

function actualizarPanelCompra() {
  const p = DB.producto(estado.producto.slug);
  const caja = document.getElementById('panel-compra');
  if (caja && p) caja.innerHTML = panelCompra(p);
}

function actualizarContadores() {
  const enlaceCarrito = app.querySelector('.acciones a[href="#/carrito"]');
  if (enlaceCarrito) {
    const piezas = Carrito.piezas();
    const previo = enlaceCarrito.querySelector('.contador');
    if (previo) previo.remove();
    if (piezas > 0) enlaceCarrito.insertAdjacentHTML('beforeend', '<span class="contador etiqueta-sm cifra">' + piezas + '</span>');
    enlaceCarrito.setAttribute('aria-label', 'Carrito, ' + piezas + ' piezas');
  }
  const enlaceFav = app.querySelector('.acciones a[href="#/favoritos"]');
  if (enlaceFav) {
    const favs = Favoritos.total();
    const previo = enlaceFav.querySelector('.contador');
    if (previo) previo.remove();
    if (favs > 0) enlaceFav.insertAdjacentHTML('beforeend', '<span class="contador etiqueta-sm cifra">' + favs + '</span>');
  }
}

function alternarEnLista(lista, valor) {
  const i = lista.indexOf(valor);
  if (i === -1) lista.push(valor); else lista.splice(i, 1);
  return i === -1;
}

/* ── Eventos: clics ───────────────────────────────────────── */
document.addEventListener('click', function (ev) {
  const d = ev.target.closest('[data-accion]');
  if (!d) return;
  const accion = d.dataset.accion;
  const a = estado.admin;

  /* Interfaz general */
  if (accion === 'alternar-buscador') { estado.buscadorAbierto = !estado.buscadorAbierto; return pintar(false); }
  if (accion === 'abrir-menu') { estado.menuAbierto = true; return pintar(false); }
  if (accion === 'cerrar-menu') {
    estado.menuAbierto = false;
    if (d.tagName === 'A') { setTimeout(function () { pintar(false); }, 0); return; }
    return pintar(false);
  }
  if (accion === 'cerrar-modal') { estado.modal = null; return pintar(false); }
  if (accion === 'cookies-ok') {
    try { window.localStorage.setItem('onix.cookies.v1', '1'); } catch (e) {}
    const caja = document.querySelector('.cookies');
    if (caja) caja.remove();
    return;
  }

  if (accion === 'favorito') {
    const guardado = Favoritos.alternar(d.dataset.id);
    aviso(guardado ? 'Guardado en favoritos' : 'Quitado de favoritos');
    if (estado.ruta === '#/favoritos') return pintar(false);
    d.setAttribute('aria-pressed', String(guardado));
    if (estado.producto) actualizarPanelCompra();
    return actualizarContadores();
  }

  /* Catálogo */
  if (accion === 'abrir-filtros') { estado.modal = { tipo: 'filtros' }; return pintar(false); }
  if (accion === 'limpiar-filtros') {
    const c = estado.catalogo;
    c.filtros = Object.assign(filtrosIniciales(), { orden: c.filtros.orden });
    return pintar(false);
  }
  if (accion === 'filtro-talla' || accion === 'filtro-color') {
    const lista = accion === 'filtro-talla' ? estado.catalogo.filtros.tallas : estado.catalogo.filtros.colores;
    const activo = alternarEnLista(lista, d.dataset.valor);
    d.setAttribute('aria-pressed', String(activo));
    return refrescarCatalogo();
  }

  /* Ficha de producto */
  if (accion === 'imagen') { estado.producto.imagen = Number(d.dataset.indice); return actualizarGaleria(); }
  if (accion === 'acordeon') {
    const i = Number(d.dataset.indice);
    estado.producto.acordeon = estado.producto.acordeon === i ? null : i;
    return pintar(false);
  }
  if (accion === 'talla') {
    estado.producto.talla = d.dataset.valor;
    estado.producto.cantidad = 1;
    return actualizarPanelCompra();
  }
  if (accion === 'color') {
    const p = DB.producto(estado.producto.slug);
    estado.producto.color = d.dataset.valor;
    estado.producto.imagen = 0;
    if (stockVariante(p, estado.producto.color, estado.producto.talla) === 0) {
      estado.producto.talla = primerTallaConStock(p, estado.producto.color);
    }
    estado.producto.cantidad = 1;
    actualizarGaleria();
    return actualizarPanelCompra();
  }
  if (accion === 'cantidad') {
    const p = DB.producto(estado.producto.slug);
    const maximo = Math.max(1, Math.min(10, stockVariante(p, estado.producto.color, estado.producto.talla)));
    estado.producto.cantidad = acotar(estado.producto.cantidad + Number(d.dataset.paso), 1, maximo);
    return actualizarPanelCompra();
  }
  if (accion === 'agregar') {
    const p = DB.producto(estado.producto.slug);
    const r = Carrito.agregar(p, estado.producto.color, estado.producto.talla, estado.producto.cantidad);
    if (!r.ok) { aviso(r.mensaje, true); return; }
    estado.producto.agregado = true;
    aviso('Agregado al carrito');
    actualizarPanelCompra();
    return actualizarContadores();
  }
  if (accion === 'guia-tallas') { estado.modal = { tipo: 'tallas' }; return pintar(false); }

  /* Contacto */
  if (accion === 'faq') {
    const i = Number(d.dataset.indice);
    estado.contacto.faq = estado.contacto.faq === i ? null : i;
    return pintar(false);
  }
  if (accion === 'otro-mensaje') {
    estado.contacto = { enviado: false, errores: {}, valores: {}, faq: null };
    return pintar(false);
  }

  /* Carrito */
  if (accion === 'vaciar') { Carrito.vaciar(); aviso('Carrito vacío'); return pintar(false); }
  if (accion === 'linea-menos' || accion === 'linea-mas') {
    const i = Number(d.dataset.indice);
    const linea = Carrito.lineas()[i];
    const r = Carrito.actualizar(i, linea.cantidad + (accion === 'linea-mas' ? 1 : -1));
    if (!r.ok && r.mensaje) aviso(r.mensaje, true);
    return pintar(false);
  }
  if (accion === 'linea-quitar') { Carrito.quitar(Number(d.dataset.indice)); return pintar(false); }
  if (accion === 'cupon') {
    const campo = document.getElementById('cupon');
    const codigo = campo ? campo.value.trim() : '';
    estado.pago.cupon = codigo;
    if (!codigo) { estado.pago.aviso = 'Escribe un cupón para aplicarlo.'; return pintar(false); }
    const r = DB.validarCupon(codigo, Carrito.subtotal());
    if (r.ok) {
      estado.pago.cuponAplicado = r.cupon;
      estado.pago.aviso = 'Cupón aplicado: −' + precio(r.descuento) + '.';
      aviso('Cupón ' + r.cupon.codigo + ' aplicado');
    } else {
      estado.pago.cuponAplicado = null;
      estado.pago.aviso = r.mensaje;
    }
    return pintar(false);
  }

  /* Panel: navegación y sesión */
  if (accion === 'admin-menu') { estadoAdmin().menuAbierto = !a.menuAbierto; return pintar(false); }
  if (accion === 'cerrar-admin-menu') { if (a) a.menuAbierto = false; return; }
  if (accion === 'salir') { Auth.salir(); aviso('Sesión cerrada'); location.hash = '#/admin/entrar'; return pintar(true); }
  if (accion === 'restaurar') {
    DB.restaurar();
    Carrito.vaciar();
    aviso('Datos de demostración restaurados');
    return pintar(false);
  }

  /* Panel: productos */
  if (accion === 'duplicar') {
    const nuevo = DB.duplicarProducto(d.dataset.id);
    aviso('Duplicado como borrador');
    location.hash = '#/admin/productos/nuevo?editar=' + nuevo.slug;
    return;
  }
  if (accion === 'admin-eliminar') { estado.modal = { tipo: 'eliminar', id: d.dataset.id }; return pintar(false); }
  if (accion === 'confirmar-eliminar') {
    DB.eliminarProducto(d.dataset.id);
    estado.modal = null;
    aviso('Producto eliminado');
    return pintar(false);
  }
  if (accion === 'forma-talla') {
    alternarEnLista(a.forma.tallas, d.dataset.valor);
    recalcularVariantes(a.forma);
    return pintar(false);
  }
  /* Colores: cualquiera, no una paleta cerrada. */
  if (accion === 'color-paleta') {
    const base = PALETA.find(function (c) { return c.nombre === d.dataset.valor; });
    const i = a.forma.colores.findIndex(function (c) { return c.nombre === base.nombre; });
    if (i === -1) a.forma.colores.push(nuevoColor(base.nombre, base.hex, a.forma));
    else a.forma.colores.splice(i, 1);
    recalcularVariantes(a.forma);
    return pintar(false);
  }
  if (accion === 'color-agregar') {
    const nombre = limpiar((document.getElementById('nc-nombre') || {}).value, 40);
    const hex = normalizarHex((document.getElementById('nc-hex-texto') || {}).value);
    if (!nombre) { aviso('Ponle nombre al color.', true); return; }
    if (!hex) { aviso('El color debe ser un hexadecimal como #4a5340.', true); return; }
    if (a.forma.colores.some(function (c) { return sinAcentos(c.nombre) === sinAcentos(nombre); })) {
      aviso('Ya existe un color con ese nombre.', true); return;
    }
    a.forma.colores.push(nuevoColor(nombre, hex, a.forma));
    recalcularVariantes(a.forma);
    aviso('Color ' + nombre + ' agregado');
    return pintar(false);
  }
  if (accion === 'color-quitar') {
    a.forma.colores.splice(Number(d.dataset.indice), 1);
    recalcularVariantes(a.forma);
    return pintar(false);
  }
  if (accion === 'color-imagenes') {
    estado.modal = { tipo: 'imagenes', indice: Number(d.dataset.indice) };
    return pintar(false);
  }

  /* Imágenes de un color */
  if (accion === 'img-dibujo' || accion === 'img-detalle') {
    const color = a.forma.colores[estado.modal.indice];
    const arte = (a.forma.imagenes[0] && a.forma.imagenes[0].arte) || 'accesorio';
    color.imagenes.push(accion === 'img-detalle'
      ? { origen: 'generado', arte: arte, tono: tonoDeHex(color.hex), hex: color.hex, detalle: true }
      : { origen: 'generado', arte: arte, tono: d.dataset.valor });
    return pintar(false);
  }
  if (accion === 'img-url') {
    const campo = document.getElementById('img-url');
    const valor = campo ? campo.value.trim() : '';
    if (!/^https?:\/\//.test(valor)) { aviso('La dirección debe empezar con http:// o https://', true); return; }
    a.forma.colores[estado.modal.indice].imagenes.push({ origen: 'url', url: valor });
    aviso('Imagen agregada');
    return pintar(false);
  }
  if (accion === 'img-quitar') {
    a.forma.colores[estado.modal.indice].imagenes.splice(Number(d.dataset.i), 1);
    return pintar(false);
  }
  if (accion === 'img-principal') {
    const lista = a.forma.colores[estado.modal.indice].imagenes;
    lista.unshift(lista.splice(Number(d.dataset.i), 1)[0]);
    return pintar(false);
  }
  if (accion === 'img-drive') {
    if (!Drive.configurado()) {
      aviso('Faltan GOOGLE_CLIENT_ID y GOOGLE_API_KEY en env.js', true);
      return;
    }
    const indiceColor = estado.modal.indice;
    Drive.elegir().then(function (elegido) {
      if (!elegido) return;
      /* Si Storage está encendido, la foto se copia allí: Drive elige,
         Supabase sirve. Si no, se queda la referencia de Drive. */
      const destino = Nube.activa()
        ? Drive.copiarAStorage(elegido).then(function (url) { return { origen: 'url', url: url }; })
        : Promise.resolve({ origen: 'drive', fileId: elegido.fileId });
      return destino.then(function (fuente) {
        a.forma.colores[indiceColor].imagenes.push(fuente);
        aviso('Imagen tomada de Drive');
        pintar(false);
      });
    }).catch(function (e) { aviso(e.message, true); });
    return;
  }
  if (accion === 'img-subir') {
    const entrada = document.getElementById('archivo-imagen');
    if (!Nube.activa()) { aviso('Storage necesita las llaves de Supabase en env.js', true); return; }
    if (entrada) entrada.click();
    return;
  }

  if (accion === 'forma-arte') {
    const arte = d.dataset.valor;
    a.forma.imagenes = a.forma.imagenes.map(function (img) {
      return img.origen === 'generado' ? Object.assign({}, img, { arte: arte }) : img;
    });
    a.forma.colores.forEach(function (c) {
      c.imagenes = c.imagenes.map(function (img) {
        return img.origen === 'generado' ? Object.assign({}, img, { arte: arte }) : img;
      });
    });
    return pintar(false);
  }

  /* Panel: inventario */
  if (accion === 'inv-producto') { a.invProducto = d.dataset.id; return pintar(false); }
  if (accion === 'guardar-inventario') {
    const p = DB.producto(d.dataset.id);
    const variantes = copia(p.variantes);
    document.querySelectorAll('[data-inv]').forEach(function (campo) {
      const i = Number(campo.dataset.inv);
      if (variantes[i]) variantes[i].stock = Math.max(0, Number(campo.value) || 0);
    });
    DB.actualizarVariantes(p.id, variantes);
    aviso('Existencias actualizadas');
    return;
  }

  /* Panel: pedidos */
  if (accion === 'ver-pedido') { estado.modal = { tipo: 'pedido', id: d.dataset.id }; return pintar(false); }
  if (accion === 'borrar-pedido') {
    const pedido = DB.pedidos().find(function (x) { return x.id === d.dataset.id; });
    estado.modal = {
      tipo: 'borrar-pedido', id: d.dataset.id,
      /* Si nunca se entregó, lo esperable es reponer las piezas. */
      devolver: !!pedido && pedido.estado !== 'entregado'
    };
    return pintar(false);
  }
  if (accion === 'confirmar-borrar-pedido') {
    const r = DB.eliminarPedido(d.dataset.id, estado.modal.devolver);
    estado.modal = null;
    aviso(r.ok ? 'Pedido ' + r.numero + ' eliminado' : r.mensaje, !r.ok);
    return pintar(false);
  }

  /* Panel: categorías */
  if (accion === 'nueva-categoria') {
    a.categoria = { nombre: '', descripcion: '', imagen: { origen: 'generado', arte: 'sudadera', tono: 'noche' } };
    estado.modal = { tipo: 'categoria' };
    return pintar(false);
  }
  if (accion === 'editar-categoria') {
    a.categoria = copia(DB.categorias().find(function (c) { return c.id === d.dataset.id; }));
    estado.modal = { tipo: 'categoria' };
    return pintar(false);
  }
  if (accion === 'cat-arte') {
    a.categoria.imagen = Object.assign({}, a.categoria.imagen, { arte: d.dataset.valor });
    return pintar(false);
  }
  if (accion === 'guardar-categoria') {
    const c = a.categoria;
    if (!limpiar(c.nombre)) { aviso('Escribe un nombre para la categoría.', true); return; }
    c.slug = c.slug || slugify(c.nombre);
    DB.guardarCategoria(c);
    estado.modal = null;
    aviso('Categoría guardada');
    return pintar(false);
  }
  if (accion === 'borrar-categoria') {
    const r = DB.eliminarCategoria(d.dataset.id);
    aviso(r.ok ? 'Categoría eliminada' : r.mensaje, !r.ok);
    return pintar(false);
  }

  /* Panel: cupones */
  if (accion === 'nuevo-cupon') {
    a.cupon = { codigo: '', tipo: 'porcentaje', valor: 10, minimo: 0, maxUsos: 0, activo: true };
    estado.modal = { tipo: 'cupon' };
    return pintar(false);
  }
  if (accion === 'editar-cupon') {
    a.cupon = copia(DB.cupones().find(function (c) { return c.id === d.dataset.id; }));
    estado.modal = { tipo: 'cupon' };
    return pintar(false);
  }
  if (accion === 'guardar-cupon') {
    const c = a.cupon;
    c.codigo = String(c.codigo || '').trim().toUpperCase();
    if (!c.codigo) { aviso('El cupón necesita un código.', true); return; }
    if (!(Number(c.valor) > 0)) { aviso('El valor debe ser mayor que cero.', true); return; }
    c.valor = Number(c.valor); c.minimo = Number(c.minimo) || 0; c.maxUsos = Number(c.maxUsos) || 0;
    DB.guardarCupon(c);
    estado.modal = null;
    aviso('Cupón guardado');
    return pintar(false);
  }
  if (accion === 'borrar-cupon') { DB.eliminarCupon(d.dataset.id); aviso('Cupón eliminado'); return pintar(false); }

  /* Panel: portada y pestañas */
  if (accion === 'portada-arte') { a.portada.imagen = Object.assign({}, a.portada.imagen, { arte: d.dataset.valor }); return pintar(false); }
  if (accion === 'portada-tono') { a.portada.imagen = Object.assign({}, a.portada.imagen, { tono: d.dataset.valor }); return pintar(false); }
  if (accion === 'pestana') { a.pestana = d.dataset.valor; a.guardado = false; return pintar(false); }
});

/* ── Eventos: campos ──────────────────────────────────────── */
function alCambiarCampo(ev) {
  const campo = ev.target;
  const a = estado.admin;

  if (campo.dataset.filtro) {
    const f = estado.catalogo.filtros;
    const tipo = campo.dataset.filtro;
    if (tipo === 'consulta') f.consulta = campo.value;
    else if (tipo === 'orden') f.orden = campo.value;
    else if (tipo === 'precio') f.precioMax = Number(campo.value);
    else if (tipo === 'categoria') { if (campo.checked) f.categorias.push(campo.value); else f.categorias = f.categorias.filter(function (v) { return v !== campo.value; }); }
    else if (tipo === 'estado') { if (campo.checked) f.disponibilidad.push(campo.value); else f.disponibilidad = f.disponibilidad.filter(function (v) { return v !== campo.value; }); }
    else if (tipo === 'ofertas') f.soloOfertas = campo.checked;
    return refrescarCatalogo();
  }

  if (campo.dataset.admin) {
    const tipo = campo.dataset.admin;
    if (tipo === 'consulta') a.consulta = campo.value;
    if (tipo === 'categoria') a.categoriaFiltro = campo.value;
    if (tipo === 'estado') a.estadoFiltro = campo.value;
    if (tipo === 'pedido') { a.pedidoFiltro = campo.value; return pintar(false); }
    const caja = document.getElementById('tabla-productos');
    if (caja) {
      caja.innerHTML = tablaProductos();
      if (tipo === 'consulta') {
        const nuevo = document.getElementById('busca-admin');
        if (nuevo) { nuevo.focus(); nuevo.setSelectionRange(nuevo.value.length, nuevo.value.length); }
      }
    }
    return;
  }

  if (campo.dataset.formaCampo) {
    const clave = campo.dataset.formaCampo;
    if (clave === 'cuidados') a.forma.cuidados = campo.value.split('\n').map(function (l) { return l.trim(); }).filter(Boolean);
    else a.forma[clave] = campo.value;
    if (clave === 'nombre' && !a.forma.slugOriginal) {
      a.forma.slug = slugify(campo.value);
      const cajaSlug = document.getElementById('f-slug');
      if (cajaSlug) cajaSlug.value = a.forma.slug;
    }
    a.guardado = false;
    return;
  }

  if (campo.dataset.variante) {
    const i = Number(campo.dataset.variante);
    if (a.forma.variantes[i]) a.forma.variantes[i].stock = Math.max(0, Number(campo.value) || 0);
    return;
  }

  if (campo.dataset.cat) { a.categoria[campo.dataset.cat] = campo.value; return; }
  if (campo.dataset.cupon) { a.cupon[campo.dataset.cupon] = campo.value; return; }
  if (campo.dataset.config) { a.config[campo.dataset.config] = campo.value; a.guardado = false; return; }
  if (campo.dataset.portada) { a.portada[campo.dataset.portada] = campo.value; a.guardado = false; return; }

  if (campo.dataset.estadoPedido) {
    DB.cambiarEstadoPedido(campo.dataset.estadoPedido, campo.value);
    aviso('Pedido ' + TEXTO_PEDIDO[campo.value].toLowerCase());
    return;
  }

  const acc = campo.dataset.accion;
  if (acc === 'forma-destacado') { a.forma.destacado = campo.checked; return; }
  if (acc === 'forma-nuevo') { a.forma.nuevo = campo.checked; return; }
  if (acc === 'config-aviso') { a.config.mostrarAviso = campo.checked; return; }
  if (acc === 'config-cambios') { a.config.aceptarCambios = campo.checked; return; }
  if (acc === 'config-msi') { a.config.mesesSinIntereses = campo.checked; return; }
  if (acc === 'cupon-activo') { a.cupon.activo = campo.checked; return; }
  if (acc === 'borrar-devolver') { estado.modal.devolver = campo.checked; return; }
  if (acc === 'alternar-categoria') {
    const c = copia(DB.categorias().find(function (x) { return x.id === campo.dataset.id; }));
    c.activa = campo.checked;
    DB.guardarCategoria(c);
    aviso(c.activa ? 'Categoría visible en la tienda' : 'Categoría oculta');
    return;
  }
  if (acc === 'alternar-promo') {
    const promos = copia(DB.contenido().promos);
    const b = promos.find(function (x) { return x.id === campo.dataset.id; });
    if (b) b.activo = campo.checked;
    DB.guardarPromos(promos);
    return;
  }
}

/* El selector de color y su campo de texto se reflejan mutuamente. */
document.addEventListener('input', function (ev) {
  const t = ev.target;
  if (t.id === 'nc-hex') {
    const texto = document.getElementById('nc-hex-texto');
    if (texto) texto.value = t.value;
  }
  if (t.id === 'nc-hex-texto') {
    const hex = normalizarHex(t.value);
    const selector = document.getElementById('nc-hex');
    if (hex && selector) selector.value = hex;
  }
});

document.addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.id !== 'archivo-imagen' || !t.files || !t.files[0]) return;
  const indiceColor = estado.modal ? estado.modal.indice : 0;
  aviso('Subiendo imagen…');
  Nube.subir(t.files[0]).then(function (url) {
    estado.admin.forma.colores[indiceColor].imagenes.push({ origen: 'url', url: url });
    aviso('Imagen subida a Storage');
    pintar(false);
  }).catch(function (e) { aviso(e.message, true); });
});

document.addEventListener('input', alCambiarCampo);
document.addEventListener('change', function (ev) {
  const t = ev.target;
  if (t.type === 'checkbox' || t.tagName === 'SELECT') alCambiarCampo(ev);
});

/* ── Eventos: formularios ─────────────────────────────────── */
document.addEventListener('submit', function (ev) {
  const forma = ev.target.closest('[data-forma]');
  if (!forma) return;
  ev.preventDefault();
  const tipo = forma.dataset.forma;
  const a = estado.admin;

  if (tipo === 'buscar') {
    const valor = forma.querySelector('input[name="q"]').value.trim();
    location.hash = valor ? '#/buscar?q=' + encodeURIComponent(valor) : '#/productos';
    return;
  }

  if (tipo === 'boletin') {
    const correo = forma.querySelector('input[name="correo"]');
    const nota = document.getElementById('nota-boletin');
    if (!esCorreo(correo.value)) { if (nota) nota.textContent = 'Revisa el correo: falta el @ o el dominio.'; return; }
    // Etapa 1: sin backend. Aquí se conectará el alta real.
    if (nota) nota.textContent = 'Listo, quedaste en la lista.';
    correo.value = '';
    return aviso('Suscripción registrada');
  }

  if (tipo === 'contacto') {
    const datos = {
      nombre: forma.querySelector('#nombre').value,
      correo: forma.querySelector('#correo').value,
      pedido: forma.querySelector('#pedido').value,
      mensaje: forma.querySelector('#mensaje').value
    };
    const errores = {};
    if (limpiar(datos.nombre).length < 2) errores.nombre = 'Escribe tu nombre.';
    if (!esCorreo(datos.correo)) errores.correo = 'Revisa el correo: falta el @ o el dominio.';
    if (limpiar(datos.mensaje).length < 10) errores.mensaje = 'Cuéntanos un poco más, al menos 10 caracteres.';
    estado.contacto.valores = datos;
    estado.contacto.errores = errores;
    // Etapa 1: sin backend. Aquí se conectará el envío real.
    if (!Object.keys(errores).length) { estado.contacto.enviado = true; estado.contacto.valores = {}; }
    return pintar(false);
  }

  if (tipo === 'acceso') {
    const boton = forma.querySelector('button[type="submit"]');
    boton.disabled = true;
    Auth.entrar(forma.querySelector('#a-correo').value, forma.querySelector('#a-clave').value)
      .then(function (r) {
        estado.errorAcceso = r.ok ? null : r.mensaje;
        if (r.ok) { aviso('Sesión iniciada'); location.hash = '#/admin'; }
        pintar(r.ok);
      })
      .catch(function (e) { estado.errorAcceso = e.message; pintar(false); });
    return;
  }

  if (tipo === 'pago') {
    const v = {
      'p-nombre': forma.querySelector('#p-nombre').value,
      'p-correo': forma.querySelector('#p-correo').value,
      'p-telefono': forma.querySelector('#p-telefono').value,
      'p-ciudad': forma.querySelector('#p-ciudad').value,
      'p-direccion': forma.querySelector('#p-direccion').value
    };
    const errores = {};
    if (limpiar(v['p-nombre']).length < 3) errores['p-nombre'] = 'Escribe el nombre de quien recibe.';
    if (!esCorreo(v['p-correo'])) errores['p-correo'] = 'Revisa el correo: falta el @ o el dominio.';
    if (limpiar(v['p-telefono']).length < 8) errores['p-telefono'] = 'Necesitamos un teléfono para la entrega.';
    if (limpiar(v['p-ciudad']).length < 3) errores['p-ciudad'] = 'Ciudad y estado.';
    if (limpiar(v['p-direccion']).length < 10) errores['p-direccion'] = 'Calle, número, colonia y código postal.';
    estado.pago.valores = v;
    estado.pago.errores = errores;
    if (Object.keys(errores).length) return pintar(false);

    const t = totalesCarrito();
    const borrador = {
      cliente: {
        nombre: limpiar(v['p-nombre']), correo: limpiar(v['p-correo']).toLowerCase(),
        telefono: limpiar(v['p-telefono']),
        direccion: limpiar(v['p-direccion']) + ' · ' + limpiar(v['p-ciudad'])
      },
      items: Carrito.lineas().map(function (i) {
        return { productoId: i.productoId, slug: i.slug, nombre: i.nombre, sku: i.sku,
          imagen: i.imagen, precio: i.precio, color: i.color, talla: i.talla, cantidad: i.cantidad };
      }),
      cupon: estado.pago.cuponAplicado ? estado.pago.cuponAplicado.codigo : '',
      subtotal: t.subtotal, descuento: t.descuento, envio: t.envio, total: t.total
    };

    /* Con pasarela conectada se cobra ANTES de tocar el inventario: el
       pedido lo crea el webhook cuando el cobro se confirma. */
    if (PAGOS.activo) {
      const boton = forma.querySelector('button[type="submit"]');
      boton.disabled = true;
      aviso('Redirigiendo a la pasarela…');
      PAGOS.iniciar(borrador)
        .then(function (url) { location.href = url; })
        .catch(function (e) { boton.disabled = false; aviso(e.message, true); });
      return;
    }

    const r = DB.crearPedido(borrador);
    if (!r.ok) { aviso(r.mensaje, true); return pintar(false); }
    Carrito.vaciar();
    estado.pago = { errores: {}, valores: {}, cupon: '', cuponAplicado: null, aviso: '' };
    aviso('Pedido ' + r.pedido.numero + ' registrado');
    location.hash = '#/pedido/' + r.pedido.numero;
    return;
  }

  if (tipo === 'producto') {
    const f = a.forma;
    if (limpiar(f.nombre).length < 2) { aviso('El producto necesita un nombre.', true); return; }
    if (!(Number(f.precio) > 0)) { aviso('El precio debe ser mayor que cero.', true); return; }
    if (!f.variantes.length) { aviso('Elige al menos un color y una talla.', true); return; }

    const limpio = copia(f);
    delete limpio.slugOriginal;
    limpio.slug = slugify(limpio.slug || limpio.nombre);
    limpio.sku = limpiar(limpio.sku, 40) ||
      ('ONX-' + limpio.slug.slice(0, 3).toUpperCase() + '-' + Math.floor(Math.random() * 900 + 100));

    /* Dos productos con el mismo slug dejarían uno inalcanzable en la
       tienda, así que aquí se corta. El SKU se avisa pero no bloquea:
       hay negocios que lo repiten a propósito entre temporadas. */
    if (!DB.slugLibre(limpio.slug, limpio.id)) {
      const sugerido = DB.slugDisponible(limpio.slug, limpio.id);
      aviso('Ya hay un producto en /' + limpio.slug + '. Prueba con «' + sugerido + '».', true);
      const campo = document.getElementById('f-slug');
      if (campo) { campo.value = sugerido; campo.classList.add('invalido'); campo.focus(); }
      a.forma.slug = sugerido;
      return;
    }
    if (!DB.skuLibre(limpio.sku, limpio.id)) {
      aviso('Ojo: el SKU ' + limpio.sku + ' ya lo usa otro producto.');
    }
    limpio.precio = Number(limpio.precio) || 0;
    limpio.precioAntes = Number(limpio.precioAntes) || 0;
    limpio.tallas = f.tallas.slice();
    limpio.etiqueta = limpio.etiqueta || null;
    const guardado = DB.guardarProducto(limpio);
    a.forma = null;
    a.guardado = true;
    aviso(f.slugOriginal ? 'Cambios guardados' : 'Producto creado');
    location.hash = '#/admin/productos/nuevo?editar=' + guardado.slug;
    return pintar(false);
  }

  if (tipo === 'config') {
    const c = copia(a.config);
    c.envioGratisDesde = Number(c.envioGratisDesde) || 0;
    c.costoEnvio = Number(c.costoEnvio) || 0;
    c.nombrePlano = sinAcentos(c.nombre).toUpperCase();
    DB.guardarContenido({ config: c });
    a.guardado = true;
    aviso('Configuración guardada');
    return pintar(false);
  }

  if (tipo === 'portada') {
    DB.guardarContenido({ portada: copia(a.portada) });
    a.guardado = true;
    aviso('Portada actualizada');
    return pintar(false);
  }
});

/* El tabulador no debe salirse del diálogo abierto. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Tab') return;
  const capa = capaActiva();
  if (!capa) return;
  const focos = Array.prototype.filter.call(
    capa.querySelectorAll('input:not([type="hidden"]),select,textarea,button,a[href],[tabindex]:not([tabindex="-1"])'),
    function (el) { return !el.disabled && el.offsetParent !== null; });
  if (!focos.length) return;
  const primero = focos[0];
  const ultimo = focos[focos.length - 1];
  if (ev.shiftKey && document.activeElement === primero) { ev.preventDefault(); ultimo.focus(); }
  else if (!ev.shiftKey && document.activeElement === ultimo) { ev.preventDefault(); primero.focus(); }
});

/* Escape cierra lo que esté encima. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (estado.modal) { estado.modal = null; return pintar(false); }
  if (estado.menuAbierto) { estado.menuAbierto = false; return pintar(false); }
  if (estado.admin && estado.admin.menuAbierto) { estado.admin.menuAbierto = false; return pintar(false); }
});

/* Sombra de la cabecera al desplazar: sin repintar nada. */
window.addEventListener('scroll', function () {
  const compacto = window.scrollY > 24;
  if (compacto === estado.compacto) return;
  estado.compacto = compacto;
  const header = document.getElementById('header');
  if (header) header.classList.toggle('compacto', compacto);
}, { passive: true });

/* ── Arranque ─────────────────────────────────────────────── */
window.addEventListener('hashchange', function () {
  const cambio = location.hash !== ultimaRuta;
  ultimaRuta = location.hash;
  pintar(cambio);
});

/* Cualquier escritura en DB —de esta pestaña o de otra— repinta la
   vista actual. Es lo que hace que el panel y la tienda no puedan
   contradecirse. */
DB.on('*', function () { if (!pintando) pintar(false); });
Carrito.alCambiar(actualizarContadores);
Favoritos.alCambiar(actualizarContadores);

if (!location.hash) location.hash = '#/';
ultimaRuta = location.hash;
pintar(true);

/* Con llaves en env.js, el estado local se sustituye por el de Supabase
   en cuanto llega. Sin llaves esto no se ejecuta y la tienda arranca
   igual de rápido. */
if (Nube.activa()) {
  Nube.cargarTodo()
    .then(function (datos) { DB.reemplazar(datos); })
    .catch(function (e) { aviso('No se pudo leer Supabase: ' + e.message, true); });
}

/* Para depurar desde la consola. */
window.ONIX = { DB: DB, Carrito: Carrito, Favoritos: Favoritos, Auth: Auth,
  Nube: Nube, Drive: Drive, PAGOS: PAGOS, estado: estado };
})();
